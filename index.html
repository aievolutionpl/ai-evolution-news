<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Evolution News — newsy AI, krypto, tech i świat po polsku</title>
<meta name="description" content="Gęsty, czytelny przegląd newsów po polsku: AI, kryptowaluty, tech, świat, Polska, biznes, nauka, gaming, kosmos, zdrowie i ciekawostki. Kliknij depeszę, aby rozwinąć zdjęcie i pełny tekst. Bez logowania.">
<meta name="theme-color" content="#0B0D10" id="themeColorMeta">
<meta property="og:title" content="AI Evolution News">
<meta property="og:description" content="Newsy AI, krypto, tech i świat — po polsku, bez clickbaitu.">
<meta property="og:image" content="/images/hero-banner.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="/images/hero-banner.png">
<script>
/* motyw ustawiany przed pierwszym malowaniem — zero migotania */
(function(){try{var t=localStorage.getItem('aien-theme');
if(t!=='light'&&t!=='dark')t='dark';
document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<style>
/* ============================================================
   AI EVOLUTION NEWS — UI v4 „czytelnia"
   Zasada: news od pierwszej sekundy. Bez hero, bez karuzeli,
   bez paska filtrów. Jeden gęsty strumień depesz, filtrowanie
   wyłącznie ikonami kanałów. Klik = zdjęcie + pełny tekst.
   Zero zewnętrznych zasobów: fonty systemowe, ikony z /icons.svg.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  /* motyw ciemny (domyślny) */
  --bg:#0B0D10;
  --bg-soft:#11151A;
  --surface:#151A20;
  --surface-2:#1B222A;
  --line:#242C35;
  --line-soft:#1B222A;
  --text:#E9EEF4;
  --text-2:#B4C0CD;
  --muted:#7C8896;
  --accent:#FFA51F;
  --accent-soft:rgba(255,165,31,.14);
  --hot:#FF5468;
  --ok:#2FD48A;
  --shadow:0 18px 46px rgba(0,0,0,.55);
  --r:10px;
  --r-sm:7px;

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --head-h:54px;
  --maxw:940px;
}
[data-theme="light"]{
  --bg:#FFFFFF;
  --bg-soft:#F7F8FA;
  --surface:#FFFFFF;
  --surface-2:#F2F4F7;
  --line:#E2E6EC;
  --line-soft:#EDF0F4;
  --text:#0E1319;
  --text-2:#39434F;
  --muted:#6A7686;
  --accent:#B96A00;
  --accent-soft:rgba(185,106,0,.10);
  --hot:#D62A3D;
  --ok:#0E8F5A;
  --shadow:0 14px 34px rgba(15,25,40,.10);
}
/* kolory kanałów dobrano pod czarne tło — na papierze trzeba je przyciemnić */
[data-theme="light"] .p-meta .ch,
[data-theme="light"] .p-ico,
[data-theme="light"] .rail button.on{color:color-mix(in srgb,var(--c) 68%,#0E1319)}


html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  padding-bottom:56px;
}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-xs{width:13px;height:13px}
.icon-sm{width:15px;height:15px}

/* ---------- pasek postępu czytania ---------- */
#progress{position:fixed;inset:0 auto auto 0;height:2px;width:0;background:var(--accent);
  z-index:70;transition:width .12s linear}

/* ============================================================
   NAGŁÓWEK — jedna linia: marka, kanały (ikony), narzędzia
   ============================================================ */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(150%) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;height:var(--head-h);
  display:flex;align-items:center;gap:10px;padding:0 16px}

.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.brand .mk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent);color:#0B0D10}
.brand .mk .icon{width:16px;height:16px;stroke-width:2.2}
.brand b{font-size:14.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}

/* kanały jako same ikony — całe „filtrowanie" strony */
.rail{display:flex;align-items:center;gap:2px;margin-left:4px;flex:1 1 auto;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth}
.rail::-webkit-scrollbar{display:none}
.rail button{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--muted);position:relative;transition:background .14s,color .14s;flex:none}
.rail button:hover{background:var(--surface-2);color:var(--text)}
.rail button.on{color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent)}
.rail button.on::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  width:16px;height:2px;border-radius:2px;background:var(--c,var(--accent))}
.rail .sep{width:1px;height:18px;background:var(--line);margin:0 5px;flex:none}

.tools{display:flex;align-items:center;gap:2px;flex:none}
.tools button{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--muted);transition:background .14s,color .14s;position:relative}
.tools button:hover{background:var(--surface-2);color:var(--text)}
.tools button.on{color:var(--accent);background:var(--accent-soft)}
.tools .badge{position:absolute;top:1px;right:1px;min-width:14px;height:14px;padding:0 3px;
  border-radius:7px;background:var(--accent);color:#0B0D10;font:600 9.5px/14px var(--mono);
  text-align:center}

/* wyszukiwarka — schowana, dopóki nie jest potrzebna */
.searchwrap{display:none;border-top:1px solid var(--line-soft);background:var(--bg-soft)}
.searchwrap.show{display:block}
.searchwrap form{max-width:var(--maxw);margin:0 auto;padding:9px 16px;display:flex;
  align-items:center;gap:10px}
.searchwrap .icon{color:var(--muted)}
.searchwrap input{flex:1;background:none;border:none;outline:none;font-size:15px;padding:3px 0}
.searchwrap input::placeholder{color:var(--muted)}
.searchwrap .esc{font:500 10.5px/1 var(--mono);color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:4px 6px}

/* ============================================================
   STRUMIEŃ DEPESZ
   ============================================================ */
main{max-width:var(--maxw);margin:0 auto;padding:0 16px}

.meta-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:14px 2px 10px;font:500 11.5px/1 var(--mono);color:var(--muted);
  letter-spacing:.3px;text-transform:uppercase}
.meta-line b{color:var(--text-2);font-weight:600}
.meta-line .q-chip{text-transform:none;letter-spacing:0;color:var(--text-2)}
.meta-line .reset{color:var(--accent);text-transform:none;letter-spacing:0;
  font-family:var(--sans);font-size:12.5px;cursor:pointer}
.meta-line .reset:hover{text-decoration:underline}

.day{position:sticky;top:var(--head-h);z-index:20;background:var(--bg);
  padding:10px 2px 6px;font:600 11px/1 var(--mono);color:var(--muted);
  letter-spacing:1.1px;text-transform:uppercase;
  border-bottom:1px solid var(--line-soft);margin-bottom:2px}
.day b{color:var(--accent);font-weight:700}

.post{border-bottom:1px solid var(--line-soft)}
.post-head{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:12px;
  align-items:start;padding:11px 4px;text-align:left;border-radius:var(--r-sm);
  transition:background .13s}
.post-head:hover{background:var(--surface-2)}
.post:focus-visible{outline:none}
.post:focus-visible .post-head{background:var(--surface-2);
  box-shadow:inset 2px 0 0 var(--accent)}

.p-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);margin-top:1px}
.p-ico .icon{width:15px;height:15px}

.p-body{display:block;min-width:0}
.p-title{display:block;font-size:16.5px;font-weight:600;line-height:1.34;letter-spacing:-.15px;
  color:var(--text);margin-bottom:4px;overflow-wrap:anywhere}
.post.open .p-title{color:var(--accent)}
.p-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font:500 11.5px/1.4 var(--mono);color:var(--muted)}
.p-meta .ch{color:var(--c);font-weight:600}
.p-meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.45}
.p-meta .hot{color:var(--hot);font-weight:700;letter-spacing:.4px}

.p-right{display:flex;align-items:center;gap:2px;color:var(--muted)}
.p-right .act{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;
  color:var(--muted);transition:background .13s,color .13s}
.p-right .act:hover{background:var(--surface);color:var(--text)}
.p-right .act.on{color:var(--accent)}
.p-right .act.on .icon{fill:var(--accent)}
.p-right .chev{transition:transform .22s ease}
.post.open .p-right .chev{transform:rotate(180deg);color:var(--accent)}

/* ---------- rozwinięta depesza: zdjęcie + długi tekst ---------- */
.body{display:none;padding:2px 4px 26px}
.post.open .body{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.body .shot{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2);margin:6px 0 20px;aspect-ratio:16/9;max-height:min(42vh,330px)}
.body .shot img{width:100%;height:100%;object-fit:cover}

.article{max-width:66ch}
.article .lead{font-size:17.5px;line-height:1.55;color:var(--text);font-weight:500;
  margin-bottom:16px;padding-left:14px;border-left:2px solid var(--accent)}
.article p{font-size:16.5px;line-height:1.72;color:var(--text-2);margin-bottom:15px}
.article p:last-child{margin-bottom:0}

.srcline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px;
  font:500 12.5px/1 var(--mono);color:var(--muted)}
.srcline b{color:var(--text-2)}
.srcline a{color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.srcline a:hover{text-decoration:underline}

.rowtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.rowtools button{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;
  border:1px solid var(--line);border-radius:99px;font-size:12.5px;color:var(--text-2);
  transition:border-color .13s,color .13s,background .13s}
.rowtools button:hover{border-color:var(--accent);color:var(--accent)}
.rowtools button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rowtools button.on .icon{fill:var(--accent)}

.sub{margin-top:24px;padding-top:16px;border-top:1px solid var(--line-soft);max-width:66ch}
.sub h4{display:flex;align-items:center;gap:7px;font:600 11px/1 var(--mono);
  letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.q{padding:10px 0 10px 16px;border-left:2px solid var(--line);color:var(--text-2);
  font-size:15px;line-height:1.55}
.q+.q{margin-top:2px}

/* ---------- komentarze ---------- */
.cmt{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.cmt:last-child{border-bottom:none}
.cmt-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cmt-av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--text-2);font:600 11px/1 var(--mono)}
.cmt-a{font-size:13px;font-weight:600}
.cmt-d{font:500 11px/1 var(--mono);color:var(--muted);margin-left:auto}
.cmt-b{font-size:14.5px;line-height:1.6;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.no-cmt{font-size:13.5px;color:var(--muted);padding:6px 0 12px}

.cform{margin-top:12px}
.cform textarea{width:100%;min-height:74px;resize:vertical;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:14.5px;outline:none}
.cform textarea:focus{border-color:var(--accent)}
.cform .r{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cform input{flex:1;min-width:150px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 12px;font-size:14px;outline:none}
.cform input:focus{border-color:var(--accent)}
.cform .send{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--r-sm);
  background:var(--accent);color:#0B0D10;font-size:13.5px;font-weight:600}
.cform .send:disabled{opacity:.55;cursor:default}
.cmsg{font-size:12.5px;margin-top:7px;min-height:16px}
.cmsg.err{color:var(--hot)}.cmsg.ok{color:var(--ok)}.cmsg.pending{color:var(--muted)}

/* ---------- stany ---------- */
.skel{height:62px;border-bottom:1px solid var(--line-soft);
  background:linear-gradient(90deg,transparent,var(--surface-2),transparent);
  background-size:200% 100%;animation:sh 1.25s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h3{font-size:17px;color:var(--text);margin-bottom:8px}
.empty button{margin-top:16px;color:var(--accent);font-size:14px}
.empty button:hover{text-decoration:underline}

/* ---------- stopka ---------- */
footer{max-width:var(--maxw);margin:44px auto 0;padding:22px 16px 34px;
  border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;
  align-items:center;justify-content:space-between;
  font:500 11.5px/1.6 var(--mono);color:var(--muted)}
footer kbd{border:1px solid var(--line);border-radius:4px;padding:2px 5px;
  font:500 10.5px/1 var(--mono);color:var(--text-2)}
footer .keys{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- do góry ---------- */
#toTop{position:fixed;right:16px;bottom:16px;width:40px;height:40px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
  display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .18s,transform .18s;z-index:50}
#toTop.show{opacity:1;pointer-events:auto;transform:none}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);z-index:90;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  padding:10px 16px;border-radius:99px;font-size:13.5px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--hot);color:var(--hot)}

@media (max-width:720px){
  .brand b{display:none}
  .p-title{font-size:15px;line-height:1.32}
  .p-meta{flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
  .p-meta .src{display:none}
  .article p,.article .lead{font-size:16px}
  main{padding:0 12px}
  .post-head{grid-template-columns:22px 1fr auto;gap:10px}
  .p-ico{width:22px;height:22px;border-radius:6px}
  .p-ico .icon{width:13px;height:13px}
  .p-right .act[data-share]{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<div id="progress"></div>

<header class="top">
  <div class="top-in">
    <a href="#" class="brand" aria-label="AI Evolution News — strona główna">
      <span class="mk"><svg class="icon" aria-hidden="true"><use href="/icons.svg#luc-zap"/></svg></span>
      <b>AI EVOLUTION <i>NEWS</i></b>
    </a>
    <nav class="rail" id="rail" aria-label="Kanały tematyczne"></nav>
    <div class="tools">
      <button id="hotBtn" title="Tylko gorące" aria-label="Tylko gorące" aria-pressed="false"><svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-flame"/></svg></button>
      <button id="savedBtn" title="Zapisane" aria-label="Zapisane" aria-pressed="false"><svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-star"/></svg><span class="badge" id="savedBadge" hidden>0</span></button>
      <button id="searchBtn" title="Szukaj (/)" aria-label="Szukaj" aria-pressed="false"><svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-search"/></svg></button>
      <button id="themeBtn" title="Motyw jasny/ciemny" aria-label="Zmień motyw"><svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-moon"/></svg></button>
    </div>
  </div>
  <div class="searchwrap" id="searchWrap">
    <form onsubmit="return false">
      <svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-search"/></svg>
      <input id="q" type="search" placeholder="szukaj: bitcoin, gta 6, openai, swiat…" autocomplete="off" aria-label="Szukaj depesz">
      <button class="esc" id="qClear">ESC</button>
    </form>
  </div>
</header>

<main>
  <div class="meta-line" id="metaLine"><span>ładowanie depesz…</span></div>
  <div id="feed">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <div class="skel"></div><div class="skel"></div>
  </div>
</main>

<footer>
  <span>© 2026 AI Evolution News · po polsku, bez logowania</span>
  <span class="keys">
    <span><kbd>/</kbd> szukaj</span>
    <span><kbd>J</kbd><kbd>K</kbd> nawigacja</span>
    <span><kbd>Enter</kbd> rozwiń</span>
    <span><kbd>S</kbd> zapisz</span>
  </span>
</footer>

<button id="toTop" aria-label="Do góry"><svg class="icon" aria-hidden="true"><use href="/icons.svg#luc-arrow-up"/></svg></button>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   KANAŁY — kolor + ikona + etykieta
   ============================================================ */
var CATS={
  ai:     {label:'AI',          color:'#8B9BFF', icon:'luc-brain'},
  krypto: {label:'Krypto',      color:'#FFA51F', icon:'luc-btc'},
  tech:   {label:'Tech',        color:'#3FD8F0', icon:'luc-chip'},
  swiat:  {label:'Świat',       color:'#19D6C4', icon:'luc-globe'},
  polska: {label:'Polska',      color:'#FF6B6B', icon:'luc-flag'},
  biznes: {label:'Biznes',      color:'#3FDC86', icon:'luc-trending-up'},
  nauka:  {label:'Nauka',       color:'#BB92FF', icon:'luc-atom'},
  gaming: {label:'Gaming',      color:'#FF74C6', icon:'luc-gamepad'},
  kosmos: {label:'Kosmos',      color:'#6BA3FF', icon:'luc-rocket'},
  zdrowie:{label:'Zdrowie',     color:'#FF8A96', icon:'luc-heart-pulse'},
  fun:    {label:'Ciekawostki', color:'#FFD23F', icon:'luc-smile'}
};
var FALLBACK={label:'Inne',color:'#7E90A6',icon:'luc-help'};
var ORDER=['ai','krypto','tech','swiat','polska','biznes','nauka','gaming','kosmos','zdrowie','fun'];
function cat(id){return CATS[id]||FALLBACK;}
function ico(name,cls){return '<svg class="icon '+(cls||'icon-sm')+'" aria-hidden="true"><use href="/icons.svg#'+name+'"/></svg>';}

var NEWS=[],META={},activeCat='all',hotOnly=false,savedOnly=false,search='';
var SAVED=new Set(),COVERS=new Map(),READY=new Set(),searchTimer=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
/* „Świat" == „swiat", „Łódź" == „lodz" */
function norm(s){return String(s==null?'':s).toLowerCase().replace(/ł/g,'l')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function $(id){return document.getElementById(id);}

/* ============================================================
   ZAPISANE (localStorage)
   ============================================================ */
function loadSaved(){
  try{var raw=localStorage.getItem('aien-saved');
    SAVED=new Set(raw?JSON.parse(raw).map(Number).filter(function(n){return !isNaN(n);}):[]);}
  catch(e){SAVED=new Set();}
}
function isSaved(id){return SAVED.has(Number(id));}
function toggleSaved(id){
  id=Number(id);
  var on=!SAVED.has(id);
  if(on)SAVED.add(id);else SAVED.delete(id);
  try{localStorage.setItem('aien-saved',JSON.stringify([].concat(Array.from(SAVED))));}catch(e){}
  document.querySelectorAll('[data-save="'+id+'"]').forEach(function(b){
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
    var l=b.querySelector('.lbl');if(l)l.textContent=on?'Zapisane':'Zapisz';
  });
  syncTools();
  if(savedOnly)render();
  toast(on?'Zapisano na później':'Usunięto z zapisanych');
}

/* ============================================================
   OKŁADKI — abstrakcyjna grafika SVG dla depesz bez zdjęcia.
   Zero liter i logotypów: tylko geometria w kolorze kanału,
   deterministycznie z id, bez ani jednego requestu.
   ============================================================ */
function hash(n){var h=(n*2654435761)>>>0;h^=h>>>13;h=(h*1274126177)>>>0;return h;}
function shade(hex,amt){
  var c=hex.replace('#',''),num=parseInt(c,16);
  var r=(num>>16)&255,g=(num>>8)&255,b=num&255;
  function m(v){return Math.max(0,Math.min(255,Math.round(v+(amt<0?v:255-v)*amt)));}
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);
}
var MOTIF={ai:'circuit',tech:'circuit',krypto:'bars',biznes:'bars',
  kosmos:'orbit',swiat:'orbit',polska:'orbit',
  nauka:'wave',zdrowie:'wave',gaming:'grid',fun:'grid'};
function coverFor(n){
  var key=n.id+':'+n.category;
  if(COVERS.has(key))return COVERS.get(key);
  var c=cat(n.category),base=c.color,h=hash(n.id||1);
  var dark=shade(base,-0.86),mid=shade(base,-0.62),light=shade(base,0.18);
  var motif=MOTIF[n.category]||'grid';
  var cx=140+(h%520),cy=90+((h>>7)%270);
  var art='';

  if(motif==='circuit'){
    for(var i=0;i<9;i++){
      var hh=hash((n.id||1)*31+i);
      var y=30+(hh%390),x=(hh>>9)%420,len=120+((hh>>15)%260),br=40+((hh>>5)%90);
      art+='<path d="M'+x+' '+y+'h'+len+'l'+br+' '+(hh%2?br:-br)+'h'+(70+(hh>>11)%120)+'" '
        +'fill="none" stroke="'+base+'" stroke-opacity=".30" stroke-width="1.5"/>'
        +'<circle cx="'+(x+len)+'" cy="'+y+'" r="3.2" fill="'+base+'" fill-opacity=".55"/>';
    }
  }else if(motif==='bars'){
    for(var b2=0;b2<22;b2++){
      var hb=hash((n.id||1)*17+b2),bh=40+(hb%300);
      art+='<rect x="'+(28+b2*35)+'" y="'+(420-bh)+'" width="16" height="'+bh+'" rx="2" '
        +'fill="'+base+'" fill-opacity="'+(0.10+(hb%5)*0.045).toFixed(3)+'"/>';
    }
    art+='<path d="M28 300 L 220 210 L 400 260 L 560 130 L 772 180" fill="none" '
      +'stroke="'+base+'" stroke-opacity=".62" stroke-width="2.4"/>';
  }else if(motif==='orbit'){
    for(var o=0;o<4;o++){
      art+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(70+o*78)+'" ry="'+(28+o*32)+'" '
        +'transform="rotate('+((h>>o)%70-35)+' '+cx+' '+cy+')" fill="none" stroke="'+base+'" '
        +'stroke-opacity="'+(0.42-o*0.08).toFixed(2)+'" stroke-width="1.4"/>';
    }
    art+='<circle cx="'+cx+'" cy="'+cy+'" r="30" fill="'+base+'" fill-opacity=".28"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="14" fill="'+base+'" fill-opacity=".55"/>';
  }else if(motif==='wave'){
    for(var w=0;w<7;w++){
      var amp=18+((h>>w)%46),off=60+w*52;
      art+='<path d="M-20 '+off+' Q 180 '+(off-amp)+' 400 '+off+' T 820 '+off+'" fill="none" '
        +'stroke="'+base+'" stroke-opacity="'+(0.5-w*0.05).toFixed(2)+'" stroke-width="1.6"/>';
    }
  }else{
    for(var g=0;g<30;g++){
      var hg=hash((n.id||1)*53+g),s=26+(hg%64);
      art+='<rect x="'+(hg%740)+'" y="'+((hg>>9)%390)+'" width="'+s+'" height="'+s+'" rx="4" '
        +'transform="rotate('+((hg>>5)%45)+' '+(hg%740)+' '+((hg>>9)%390)+')" '
        +'fill="none" stroke="'+base+'" stroke-opacity="'+(0.14+(hg%5)*0.05).toFixed(3)+'" stroke-width="1.3"/>';
    }
  }
  var grid='';
  for(var x2=0;x2<=800;x2+=50)grid+='<path d="M'+x2+' 0V450" stroke="#fff" stroke-opacity=".035"/>';
  for(var y2=0;y2<=450;y2+=50)grid+='<path d="M0 '+y2+'H800" stroke="#fff" stroke-opacity=".035"/>';

  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">'
    +'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    +'<stop offset="0" stop-color="'+mid+'"/><stop offset="1" stop-color="'+dark+'"/></linearGradient>'
    +'<radialGradient id="r" cx="'+Math.round(cx/8)+'%" cy="'+Math.round(cy/4.5)+'%" r="72%">'
    +'<stop offset="0" stop-color="'+light+'" stop-opacity=".55"/>'
    +'<stop offset="1" stop-color="'+dark+'" stop-opacity="0"/></radialGradient></defs>'
    +'<rect width="800" height="450" fill="'+dark+'"/>'
    +'<rect width="800" height="450" fill="url(#g)"/>'+grid+art
    +'<rect width="800" height="450" fill="url(#r)"/></svg>';
  var uri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  COVERS.set(key,uri);
  return uri;
}
function imgFor(n){return n.image||coverFor(n);}

/* ============================================================
   FORMATOWANIE
   ============================================================ */
var MONTHS=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia',
  'września','października','listopada','grudnia'];
function fmtDate(d){var p=String(d||'').split('-');
  return p.length===3?(+p[2])+' '+MONTHS[(+p[1])-1]+' '+p[0]:String(d||'');}
function todayISO(){var n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
function dayDiff(d){
  var p=String(d||'').split('-');if(p.length!==3)return null;
  var then=new Date(+p[0],+p[1]-1,+p[2]),now=new Date();
  return Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-then)/86400000);
}
function relDays(d){
  var diff=dayDiff(d);if(diff==null)return '';
  if(diff<=0)return 'dziś';if(diff===1)return 'wczoraj';
  if(diff<7)return diff+' dni temu';
  if(diff<30)return Math.floor(diff/7)+' tyg. temu';
  return fmtDate(d);
}
function dayLabel(d){
  var diff=dayDiff(d);
  if(diff===0)return '<b>Dziś</b> · '+fmtDate(d);
  if(diff===1)return '<b>Wczoraj</b> · '+fmtDate(d);
  return fmtDate(d);
}
function readMins(n){
  var w=String(n.full||n.excerpt||'').trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1,Math.ceil(w/170));
}
function isUrl(s){return /^https?:\/\//i.test(String(s||''));}

/* ============================================================
   DANE — API, a gdy niedostępne, plik ziarna
   ============================================================ */
function loadData(){
  fetch('/api/news',{headers:{Accept:'application/json'}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .catch(function(){return fetch('/seed-news.json').then(function(r){return r.json();});})
    .then(function(d){
      NEWS=Array.isArray(d.news)?d.news:[];META=d.meta||{};
      buildRail();render();syncTools();openFromHash();
    })
    .catch(function(e){
      $('feed').innerHTML='<div class="empty"><h3>Nie udało się wczytać depesz</h3><p>'
        +esc(e.message||'?')+'</p></div>';
      $('metaLine').innerHTML='<span>błąd połączenia</span>';
    });
}

/* ============================================================
   FILTROWANIE — kanał + gorące + zapisane + fraza
   ============================================================ */
function filtered(){
  var list=activeCat==='all'?NEWS:NEWS.filter(function(n){return n.category===activeCat;});
  if(hotOnly)list=list.filter(function(n){return n.hot;});
  if(savedOnly)list=list.filter(function(n){return isSaved(n.id);});
  if(search){
    var words=norm(search).split(/\s+/).filter(Boolean);
    list=list.filter(function(n){
      var hay=norm(n.title+' '+(n.excerpt||'')+' '+(n.full||'')+' '+(n.source||'')+' '+cat(n.category).label);
      return words.every(function(w){return hay.indexOf(w)>-1;});
    });
  }
  return list.slice().sort(function(a,b){
    var dd=String(b.date||'').localeCompare(String(a.date||''));
    if(dd)return dd;
    var ha=a.hot?1:0,hb=b.hot?1:0;
    if(ha!==hb)return hb-ha;
    return (b.id||0)-(a.id||0);
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function buildRail(){
  var counts={};
  NEWS.forEach(function(n){counts[n.category]=(counts[n.category]||0)+1;});
  var h='<button data-cat="all" class="'+(activeCat==='all'?'on':'')+'" '
    +'title="Wszystkie depesze ('+NEWS.length+')" aria-label="Wszystkie depesze">'
    +ico('luc-layers','icon-sm')+'</button><span class="sep"></span>';
  ORDER.forEach(function(id){
    if(!counts[id])return;
    var c=cat(id);
    h+='<button data-cat="'+id+'" class="'+(activeCat===id?'on':'')+'" style="--c:'+c.color+'" '
      +'title="'+esc(c.label)+' ('+counts[id]+')" aria-label="'+esc(c.label)+'">'
      +ico(c.icon,'icon-sm')+'</button>';
  });
  $('rail').innerHTML=h;
}

function headHTML(n){
  var c=cat(n.category),on=isSaved(n.id);
  return '<button class="post-head" style="--c:'+c.color+'" aria-expanded="false">'
    +'<span class="p-ico">'+ico(c.icon)+'</span>'
    +'<span class="p-body">'
      +'<span class="p-title">'+esc(n.title)+'</span>'
      +'<span class="p-meta">'
        +'<span class="ch">'+esc(c.label)+'</span><span class="sep"></span>'
        +'<span>'+esc(relDays(n.date))+'</span><span class="sep"></span>'
        +'<span>'+readMins(n)+' min</span>'
        +(n.source?'<span class="sep src"></span><span class="src">'+esc(n.source)+'</span>':'')
        +(n.hot?'<span class="sep"></span><span class="hot">HOT</span>':'')
      +'</span>'
    +'</span>'
    +'<span class="p-right">'
      +'<span class="act'+(on?' on':'')+'" data-save="'+n.id+'" role="button" tabindex="-1" '
        +'aria-pressed="'+(on?'true':'false')+'" title="Zapisz na później (S)">'+ico('luc-star','icon-sm')+'</span>'
      +'<span class="act" data-share="'+n.id+'" role="button" tabindex="-1" title="Kopiuj link">'
        +ico('luc-link','icon-sm')+'</span>'
      +'<span class="chev">'+ico('luc-chevron-down','icon-sm')+'</span>'
    +'</span>'
  +'</button>';
}

function bodyHTML(n){
  var c=cat(n.category),on=isSaved(n.id);
  var paras=String(n.full||n.excerpt||'').split(/\n{2,}/).filter(Boolean)
    .map(function(p){return '<p>'+esc(p.trim())+'</p>';}).join('');
  var src=n.source?(isUrl(n.source)
      ?'<a href="'+esc(n.source)+'" target="_blank" rel="noopener">'+ico('luc-external-link','icon-xs')+' Czytaj w źródle</a>'
      :'<span>Źródło: <b>'+esc(n.source)+'</b></span>'):'';
  var q=(n.questions&&n.questions.length)
    ?'<div class="sub"><h4>'+ico('luc-help','icon-xs')+' Do przemyślenia</h4>'
      +n.questions.map(function(x){return '<div class="q">'+esc(x)+'</div>';}).join('')+'</div>'
    :'';
  return '<div class="shot"><img src="'+esc(imgFor(n))+'" alt="" loading="lazy" decoding="async" '
      +'data-fb="'+esc(coverFor(n))+'" onerror="if(this.src!==this.dataset.fb)this.src=this.dataset.fb"></div>'
    +'<div class="article">'
      +(n.excerpt?'<p class="lead">'+esc(n.excerpt)+'</p>':'')
      +paras
      +'<div class="srcline">'+src
        +'<span>'+fmtDate(n.date)+'</span><span>·</span><span>'+readMins(n)+' min czytania</span></div>'
      +'<div class="rowtools">'
        +'<button class="'+(on?'on':'')+'" data-save="'+n.id+'" aria-pressed="'+(on?'true':'false')+'">'
          +ico('luc-star','icon-xs')+' <span class="lbl">'+(on?'Zapisane':'Zapisz')+'</span></button>'
        +'<button data-share="'+n.id+'">'+ico('luc-link','icon-xs')+' Link do depeszy</button>'
      +'</div>'
    +'</div>'
    +q
    +'<div class="sub"><h4>'+ico('luc-message','icon-xs')+' Komentarze <span class="cn"></span></h4>'
      +'<div class="clist"><div class="no-cmt">Ładowanie…</div></div>'
      +'<div class="cform">'
        +'<textarea placeholder="Napisz komentarz… (bez logowania)" maxlength="1200"></textarea>'
        +'<div class="r"><input type="text" placeholder="Twój nick (opcjonalnie)" maxlength="50">'
        +'<button class="send" data-send="'+n.id+'">'+ico('luc-send','icon-xs')+' Wyślij</button></div>'
        +'<div class="cmsg"></div>'
      +'</div>'
    +'</div>';
}

function render(){
  var list=filtered();
  var m=[];
  m.push('<span><b>'+list.length+'</b> '+(list.length===1?'depesza':'depesz')+'</span>');
  if(activeCat!=='all')m.push('<span>'+esc(cat(activeCat).label)+'</span>');
  if(hotOnly)m.push('<span>gorące</span>');
  if(savedOnly)m.push('<span>zapisane</span>');
  if(search)m.push('<span class="q-chip">„'+esc(search)+'”</span>');
  if(META.last_updated)m.push('<span>aktualizacja '+esc(fmtDate(META.last_updated))+'</span>');
  if(activeCat!=='all'||hotOnly||savedOnly||search)
    m.push('<button class="reset" id="resetBtn">wyczyść filtry</button>');
  $('metaLine').innerHTML=m.join('<span>·</span>');

  if(!list.length){
    $('feed').innerHTML='<div class="empty"><h3>Brak depesz</h3>'
      +'<p>Nic nie pasuje do wybranych ikon.</p>'
      +'<button id="resetBtn2">Pokaż wszystkie</button></div>';
    READY.clear();return;
  }
  var html='',lastDay='';
  list.forEach(function(n){
    if(n.date!==lastDay){lastDay=n.date;html+='<div class="day">'+dayLabel(n.date)+'</div>';}
    html+='<article class="post" data-news="'+n.id+'" id="news-'+n.id+'" tabindex="0">'
      +headHTML(n)+'<div class="body"></div></article>';
  });
  $('feed').innerHTML=html;
  READY.clear();
}

/* ============================================================
   ROZWIJANIE — treść budowana dopiero przy pierwszym otwarciu
   ============================================================ */
function newsById(id){
  id=Number(id);
  for(var i=0;i<NEWS.length;i++)if(Number(NEWS[i].id)===id)return NEWS[i];
  return null;
}
function toggle(el,force){
  var id=Number(el.dataset.news),open=force==null?!el.classList.contains('open'):force;
  if(open&&!READY.has(id)){
    var n=newsById(id);if(!n)return;
    el.querySelector('.body').innerHTML=bodyHTML(n);
    READY.add(id);
    loadComments(id);
  }
  el.classList.toggle('open',open);
  el.querySelector('.post-head').setAttribute('aria-expanded',open?'true':'false');
  if(open){try{history.replaceState(null,'','#news-'+id);}catch(e){}}
}
function headOffset(){return (document.querySelector('.top')||{offsetHeight:54}).offsetHeight+8;}
function scrollToEl(el){
  window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-headOffset())});
}
function jumpTo(id){
  var n=newsById(id);if(!n)return;
  if(activeCat!=='all'&&n.category!==activeCat)activeCat='all';
  if(hotOnly&&!n.hot)hotOnly=false;
  if(savedOnly&&!isSaved(n.id))savedOnly=false;
  if(search){search='';$('q').value='';}
  buildRail();syncTools();render();
  requestAnimationFrame(function(){
    var el=document.querySelector('[data-news="'+n.id+'"]');if(!el)return;
    toggle(el,true);scrollToEl(el);el.focus({preventScroll:true});
  });
}
function openFromHash(){
  var m=/^#news-(\d+)$/.exec(location.hash||'');
  if(m)jumpTo(+m[1]);
}

/* ============================================================
   KOMENTARZE
   ============================================================ */
function loadComments(id){
  fetch('/api/comments?news='+id)
    .then(function(r){return r.json();})
    .then(function(d){
      var list=d.comments||[];
      document.querySelectorAll('[data-news="'+id+'"]').forEach(function(card){
        var box=card.querySelector('.clist');if(!box)return;
        box.innerHTML=list.length?list.map(function(cm){
          var a=String(cm.author||'Anonim');
          return '<div class="cmt"><div class="cmt-h">'
            +'<span class="cmt-av">'+esc(a.slice(0,1).toUpperCase())+'</span>'
            +'<span class="cmt-a">'+esc(a)+'</span>'
            +'<span class="cmt-d">'+esc(cm.date||'')+(cm.time?' · '+esc(cm.time):'')+'</span></div>'
            +'<div class="cmt-b">'+esc(cm.content)+'</div></div>';
        }).join(''):'<div class="no-cmt">Brak komentarzy — bądź pierwszy.</div>';
        var cn=card.querySelector('.cn');if(cn)cn.textContent=list.length?'('+list.length+')':'';
      });
    })
    .catch(function(){
      document.querySelectorAll('[data-news="'+id+'"] .clist').forEach(function(el){
        el.innerHTML='<div class="no-cmt">Nie udało się wczytać komentarzy.</div>';});
    });
}
function sendComment(id,btn){
  var card=btn.closest('[data-news]');
  var ta=card.querySelector('.cform textarea'),au=card.querySelector('.cform input'),
      msg=card.querySelector('.cmsg');
  var content=(ta.value||'').trim();
  if(!content){msg.className='cmsg err';msg.textContent='Wpisz treść komentarza.';ta.focus();return;}
  btn.disabled=true;msg.className='cmsg pending';msg.textContent='Wysyłanie…';
  fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({newsId:Number(id),author:au.value||'Anonim',content:content})})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(res){
      if(!res.ok){msg.className='cmsg err';msg.textContent=res.d.error||'Błąd.';
        toast(res.d.error||'Błąd dodawania komentarza',true);return;}
      ta.value='';msg.className='cmsg ok';msg.textContent='✓ Komentarz dodany';
      toast('Komentarz dodany');loadComments(id);
      setTimeout(function(){msg.textContent='';},4000);
    })
    .catch(function(){msg.className='cmsg err';msg.textContent='Błąd sieci.';})
    .then(function(){btn.disabled=false;});
}

/* ============================================================
   DROBIAZGI — toast, udostępnianie, motyw
   ============================================================ */
var toastTimer=null;
function toast(msg,isErr){
  var t=$('toast');t.textContent=msg;t.className=(isErr?'err ':'')+'show';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='';},2400);
}
function shareNews(id){
  var n=newsById(id),url=location.origin+location.pathname+'#news-'+id;
  if(navigator.share){
    navigator.share({title:n?n.title:'AI Evolution News',url:url}).catch(function(){});
    return;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url)
      .then(function(){toast('Link skopiowany');})
      .catch(function(){toast(url);});
  }else toast(url);
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('aien-theme',t);}catch(e){}
  var meta=$('themeColorMeta');if(meta)meta.setAttribute('content',t==='dark'?'#0B0D10':'#FFFFFF');
  $('themeBtn').innerHTML=ico(t==='dark'?'luc-moon':'luc-sun','icon-sm');
}
function syncTools(){
  $('hotBtn').classList.toggle('on',hotOnly);
  $('hotBtn').setAttribute('aria-pressed',hotOnly?'true':'false');
  $('savedBtn').classList.toggle('on',savedOnly);
  $('savedBtn').setAttribute('aria-pressed',savedOnly?'true':'false');
  var b=$('savedBadge');
  if(SAVED.size){b.hidden=false;b.textContent=SAVED.size;}else b.hidden=true;
}
function resetFilters(){
  activeCat='all';hotOnly=false;savedOnly=false;search='';$('q').value='';
  buildRail();syncTools();render();
}
function toggleSearch(force){
  var w=$('searchWrap'),on=force==null?!w.classList.contains('show'):force;
  w.classList.toggle('show',on);
  $('searchBtn').classList.toggle('on',on);
  $('searchBtn').setAttribute('aria-pressed',on?'true':'false');
  if(on)setTimeout(function(){$('q').focus();},30);
  else if(search){search='';$('q').value='';render();}
}
function moveFocus(dir){
  var items=[].slice.call(document.querySelectorAll('.post'));
  if(!items.length)return;
  var cur=document.activeElement?document.activeElement.closest('.post'):null;
  var i=cur?items.indexOf(cur)+dir:0;
  if(i<0)i=0;if(i>=items.length)i=items.length-1;
  items[i].focus({preventScroll:true});scrollToEl(items[i]);
}

/* ============================================================
   ZDARZENIA
   ============================================================ */
function setup(){
  setTheme(document.documentElement.getAttribute('data-theme')||'dark');
  $('themeBtn').addEventListener('click',function(){
    setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');});

  $('rail').addEventListener('click',function(e){
    var b=e.target.closest('[data-cat]');if(!b)return;
    activeCat=b.dataset.cat;buildRail();render();
    window.scrollTo({top:0});
  });

  $('hotBtn').addEventListener('click',function(){hotOnly=!hotOnly;syncTools();render();});
  $('savedBtn').addEventListener('click',function(){savedOnly=!savedOnly;syncTools();render();});
  $('searchBtn').addEventListener('click',function(){toggleSearch();});
  $('qClear').addEventListener('click',function(){toggleSearch(false);});

  $('q').addEventListener('input',function(){
    clearTimeout(searchTimer);
    var v=this.value;
    searchTimer=setTimeout(function(){search=v.trim();render();},200);
  });

  /* delegacja: cały strumień + treść rozwinięta */
  $('feed').addEventListener('click',function(e){
    var send=e.target.closest('[data-send]');
    if(send){sendComment(send.dataset.send,send);return;}
    var save=e.target.closest('[data-save]');
    if(save){e.stopPropagation();toggleSaved(save.dataset.save);return;}
    var share=e.target.closest('[data-share]');
    if(share){e.stopPropagation();shareNews(share.dataset.share);return;}
    if(e.target.closest('.body'))return;              /* klik w treści nie zwija */
    var post=e.target.closest('.post');if(!post)return;
    toggle(post);
  });

  document.addEventListener('click',function(e){
    if(e.target.id==='resetBtn'||e.target.id==='resetBtn2')resetFilters();
  });

  document.addEventListener('keydown',function(e){
    var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)
      ||document.activeElement.isContentEditable;
    if(e.key==='Escape'){
      if(document.activeElement===$('q')){toggleSearch(false);$('q').blur();return;}
    }
    if(typing)return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==='/'){e.preventDefault();toggleSearch(true);return;}
    if(e.key==='j'||e.key==='J'){e.preventDefault();moveFocus(1);return;}
    if(e.key==='k'||e.key==='K'){e.preventDefault();moveFocus(-1);return;}
    var post=document.activeElement?document.activeElement.closest('.post'):null;
    if(!post)return;
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(post);return;}
    if(e.key==='s'||e.key==='S'){e.preventDefault();toggleSaved(post.dataset.news);return;}
  });

  window.addEventListener('hashchange',openFromHash);

  var prog=$('progress'),top=$('toTop');
  function onScroll(){
    var h=document.documentElement.scrollHeight-window.innerHeight;
    prog.style.width=(h>0?(window.scrollY/h*100):0)+'%';
    top.classList.toggle('show',window.scrollY>800);
  }
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  top.addEventListener('click',function(){window.scrollTo({top:0});});
}

document.addEventListener('DOMContentLoaded',function(){loadSaved();setup();syncTools();loadData();});
</script>
</body>
</html>

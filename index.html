/* ============================================================
   AI EVOLUTION NEWS — UI v5 „TELETEXT TERMINAL"
   Telegazeta (blokowe żółte nagłówki, numerowane strony, Pro736)
   × Bloomberg Terminal (gęste wiersze, amber akcent, pasek stanu).
   Zero zewnętrznych zasobów: fonty systemowe, ikony /icons.svg.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  /* ---- design tokens: LIGHT (default) ---- */
  --bg:#F4F5F2;
  --surface:#FFFFFF;
  --surface-2:#ECEEEA;
  --text:#111111;
  --text-2:#60656B;
  --muted:#8A9099;
  --border:#D8DCE0;
  --border-soft:#E1E4E7;
  --yellow:#F4B400;
  --yellow-soft:rgba(244,180,0,.14);
  --black:#0B0D0E;
  --on-black:#FFFFFF;
  --active-bg:#0B0D0E;
  --active-text:#FFFFFF;
  --link:#1768AC;
  --green:#14934A;
  --red:#D6382E;

  /* ---- typography ---- */
  --font-display:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;

  /* ---- spacing / shape scale ---- */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:28px;--sp-7:40px;
  --radius-sm:6px;--radius-md:8px;--radius-pill:999px;
  --maxw:1220px;
  --dur:140ms;
}
html[data-theme="dark"]{
  --bg:#0B0D0E;
  --surface:#15181B;
  --surface-2:#1C2024;
  --text:#EDEFF1;
  --text-2:#A7ADB4;
  --muted:#6B7178;
  --border:#272C31;
  --border-soft:#202428;
  --yellow:#F7C13B;
  --yellow-soft:rgba(247,193,59,.14);
  --black:#0B0D0E;
  --on-black:#FFFFFF;
  --active-bg:#F4F5F2;
  --active-text:#0B0D0E;
  --link:#6CB2EA;
  --green:#3FCB78;
  --red:#FF6B60;
}
html[data-theme="dark"] .cover-fallback{filter:none}
html[data-theme="light"] .cover-fallback{filter:brightness(1.04) saturate(.96)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(52px + env(safe-area-inset-bottom))}
img{max-width:100%;display:block}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-sm{width:14px;height:14px}
.icon-xs{width:12px;height:12px}

::selection{background:var(--yellow);color:#000}

:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:3px}
button:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* ================= LIVE TICKER — infinite, left→right ================= */
.ticker{position:sticky;top:0;z-index:70;background:var(--black);border-bottom:1px solid var(--border);
  height:32px;display:flex;align-items:center;overflow:hidden}
.ticker-tag{flex:none;background:var(--yellow);color:#000;font:700 10px/32px var(--font-mono);
  letter-spacing:1.5px;padding:0 12px;z-index:2}
.ticker-run{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ticker-track{display:inline-flex;gap:36px;white-space:nowrap;width:max-content;
  animation:ticker-right 34s linear infinite;padding-left:20px;will-change:transform}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes ticker-right{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.ticker-item{font:500 11.5px/32px var(--font-mono);color:#B7BEC5;cursor:pointer;transition:color var(--dur)}
.ticker-item b{color:var(--yellow);font-weight:700;margin-right:7px}
.ticker-item:hover{color:#fff}

/* ================= MASTHEAD ================= */
.masthead{border-bottom:1px solid var(--border);background:var(--surface)}
.mast-logo{width:38px;height:38px;border-radius:var(--radius-sm);flex:none;
  margin-right:12px;align-self:center;object-fit:cover}
.mast-in{max-width:var(--maxw);margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;gap:0}
.mast-block{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.2px;
  color:var(--text);text-transform:uppercase;flex:none;line-height:1.1;display:flex;align-items:center;gap:8px}
.mast-block::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--yellow);flex:none}
.mast-block .mb-news{color:var(--text-2);font-weight:600}
.mast-side{display:flex;flex-direction:column;justify-content:center;
  padding:0 0 0 20px;margin-left:20px;border-left:1px solid var(--border-soft);min-width:0}
.mast-side .sub{font:600 10px/1.5 var(--font-mono);color:var(--text-2);letter-spacing:1.6px;text-transform:uppercase}
.mast-side .clock{font:500 11px/1.5 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.mast-tools{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.mast-tools button{min-width:36px;height:36px;padding:0 6px;display:grid;place-items:center;position:relative;
  color:var(--text-2);border:1px solid transparent;border-radius:var(--radius-sm);transition:color var(--dur),border-color var(--dur),background var(--dur)}
.mast-tools button:hover{color:var(--text);border-color:var(--border)}
.mast-tools button.on{color:var(--active-text);background:var(--active-bg)}
.mast-tools .badge{position:absolute;transform:translate(10px,-10px);min-width:14px;height:14px;
  padding:0 3px;border-radius:7px;background:var(--yellow);color:#000;font:700 9px/14px var(--font-mono);text-align:center}

/* ================= KANAŁY — P101/P102… channel selector ================= */
.pages{border-bottom:1px solid var(--border);background:var(--surface)}
.pages-in{max-width:var(--maxw);margin:0 auto;padding:10px 20px;display:flex;gap:8px;
  overflow-x:auto;scrollbar-width:none}
.pages-in::-webkit-scrollbar{display:none}
.pg{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px;min-height:32px;
  border:1px solid var(--border);border-radius:var(--radius-pill);color:var(--text);
  font:600 11px/1 var(--font-mono);letter-spacing:.4px;cursor:pointer;background:transparent;
  text-transform:uppercase;transition:border-color var(--dur),background var(--dur),color var(--dur);white-space:nowrap}
.pg i{font-style:normal;color:var(--text-2);font-weight:700}
.pg .dot{width:7px;height:7px;border-radius:2px;background:var(--c,var(--yellow));flex:none}
.pg:hover{border-color:var(--text);color:var(--text)}
.pg.on{background:var(--active-bg);border-color:var(--active-bg);color:var(--active-text)}
.pg.on i{color:var(--active-text);opacity:.7}
.pg.on .dot{background:var(--yellow)}

/* pasek szukania */
.searchbar{display:none;border-bottom:1px solid var(--border);background:var(--surface)}
.searchbar.show{display:block}
.searchbar form{max-width:var(--maxw);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px}
.searchbar .icon{color:var(--yellow)}
.searchbar input{flex:1;background:none;border:none;outline:none;
  font:500 14px/1.4 var(--font-body);color:var(--text);padding:4px 0}
.searchbar input::placeholder{color:var(--muted)}
.searchbar .esc{font:600 10px/1 var(--font-mono);color:var(--muted);border:1px solid var(--border);
  border-radius:3px;padding:4px 7px}

/* ================= STATUS BAR — compact newsroom line ================= */
.statusbar{max-width:var(--maxw);margin:0 auto;padding:14px 20px 0;
  display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;
  font:500 11px/1.5 var(--font-mono);color:var(--text-2);letter-spacing:.4px;text-transform:uppercase;
  font-variant-numeric:tabular-nums}
.statusbar b{color:var(--text);font-weight:700}
.statusbar .chip{color:var(--text-2)}
.statusbar .reset{color:var(--link);cursor:pointer;text-transform:none;letter-spacing:0}
.statusbar .reset:hover{text-decoration:underline}

/* ================= LISTA DEPESZ — newswire ================= */
main{max-width:var(--maxw);margin:0 auto;padding:6px 20px 30px}
#feed{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
#feed>.post:last-child{border-bottom:none}

.day{position:sticky;top:36px;z-index:20;background:var(--surface);
  padding:16px 16px 8px;display:flex;align-items:center;gap:10px;
  font:700 10.5px/1 var(--font-mono);color:var(--text-2);letter-spacing:2px;text-transform:uppercase}
.day::after{content:"";flex:1;height:1px;background:var(--border-soft)}
.day b{color:var(--yellow)}

.post{border-bottom:1px solid var(--border-soft);position:relative}
.post-head{width:100%;display:grid;grid-template-columns:1fr 120px 32px;gap:16px;
  align-items:center;padding:18px 16px;text-align:left;transition:background var(--dur)}
.post-head:hover{background:var(--surface-2)}
.post:focus-visible{outline:none}
.post:focus-visible .post-head{background:var(--surface-2)}

.p-body{min-width:0;grid-row:1;grid-column:1}
.p-title{display:block;font-family:var(--font-display);font-size:20px;font-weight:680;line-height:1.25;
  letter-spacing:-.2px;color:var(--text);overflow-wrap:anywhere}
.post-head:hover .p-title{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.post.open .p-title{color:var(--text)}
.post.open .p-title::before{content:"▸ ";color:var(--yellow)}
.p-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;
  font:500 12px/1.5 var(--font-mono);color:var(--text-2);letter-spacing:.2px}
.p-meta .cat-tag{display:inline-flex;align-items:center;gap:5px;color:var(--text-2);font-weight:600;text-transform:uppercase}
.p-meta .cat-tag .dot{width:6px;height:6px;border-radius:2px;background:var(--c,var(--yellow));flex:none}
.p-meta .cat-tag b{color:var(--muted);font-weight:600}
.p-meta .src{color:var(--muted);font-family:var(--font-body)}
.p-meta .ago{color:var(--text-2);font-weight:600}
.p-meta .hot{color:#fff;background:var(--red);font:700 10px/1 var(--font-mono);letter-spacing:.4px;padding:3px 7px;border-radius:3px}
.p-meta .sep{width:3px;height:3px;background:currentColor;opacity:.35;border-radius:50%}

.p-right{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);flex:none;
  grid-row:1;grid-column:3}
.p-right .act{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius-sm);
  color:var(--muted);transition:color var(--dur),background var(--dur)}
.p-right .act:hover{color:var(--text);background:var(--surface-2)}
.p-right .act.on{color:#000;background:var(--yellow)}
.p-right .chev{transition:transform 200ms}
.post.open .p-right .chev{transform:rotate(180deg);color:var(--text)}

/* miniatura depesy */
.p-thumb{display:block;width:120px;height:76px;overflow:hidden;background:var(--surface-2);
  border:1px solid var(--border-soft);border-radius:var(--radius-sm);flex:none;align-self:center;
  grid-row:1;grid-column:2}
.p-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 220ms ease}
.post-head:hover .p-thumb img{transform:scale(1.04)}

/* ---------- rozwinięta depesza ---------- */
.body{display:none;padding:4px 16px 28px}
.post.open .body{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.body .shot{overflow:hidden;border:1px solid var(--border);background:var(--surface-2);
  border-radius:var(--radius-md);margin:4px 0 18px;aspect-ratio:16/9;max-height:min(42vh,340px)}
.body .shot img{width:100%;height:100%;object-fit:cover}

.article{max-width:70ch}
.article .lead{font-family:var(--font-body);font-size:17px;line-height:1.55;color:var(--text);
  font-weight:600;margin-bottom:14px;padding:12px 16px;background:var(--surface-2);
  border-left:3px solid var(--yellow);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.article p{font-family:var(--font-body);font-size:15.5px;line-height:1.72;color:var(--text-2);margin-bottom:14px}
.article p:last-child{margin-bottom:0}

.srcline{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;
  font:500 11.5px/1.6 var(--font-mono);color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.srcline b{color:var(--text-2)}
.srcline a{color:var(--link)}
.srcline a:hover{text-decoration:underline}

.rowtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.rowtools button{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;min-height:36px;
  border:1px solid var(--border);border-radius:var(--radius-sm);font:600 12px/1 var(--font-mono);
  letter-spacing:.5px;color:var(--text-2);text-transform:uppercase;transition:border-color var(--dur),color var(--dur)}
.rowtools button:hover{border-color:var(--text);color:var(--text)}
.rowtools button.on{border-color:var(--yellow);color:var(--text);background:var(--yellow-soft)}

.sub{margin-top:22px;padding-top:16px;border-top:1px solid var(--border-soft);max-width:70ch}
.sub h4{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font:700 12.5px/1 var(--font-display);
  letter-spacing:.4px;text-transform:uppercase;color:var(--text);margin-bottom:12px}
.q{padding:10px 0 10px 14px;border-left:2px solid var(--border);color:var(--text-2);
  font-family:var(--font-body);font-size:14.5px;line-height:1.55}
.q+.q{margin-top:2px}

/* komentarze */
.cmt{padding:12px 0;border-bottom:1px solid var(--border-soft)}
.cmt:last-child{border-bottom:none}
.cmt-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cmt-av{width:22px;height:22px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--surface-2);
  color:var(--text-2);font:700 10px/1 var(--font-mono)}
.cmt-a{font:600 12.5px/1 var(--font-body)}
.cmt-d{font:500 10.5px/1 var(--font-mono);color:var(--muted);margin-left:auto}
.cmt-b{font-family:var(--font-body);font-size:14px;line-height:1.6;color:var(--text-2);
  white-space:pre-wrap;overflow-wrap:anywhere}
.no-cmt{font-size:13px;color:var(--muted);padding:5px 0 10px}

.cform{margin-top:12px}
.cform textarea{width:100%;min-height:70px;resize:vertical;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;
  font:400 14px/1.5 var(--font-body);color:var(--text);outline:none;transition:border-color var(--dur)}
.cform textarea:focus{border-color:var(--text)}
.cform .r{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cform input{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;outline:none;transition:border-color var(--dur)}
.cform input:focus{border-color:var(--text)}
.cform .send{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;min-height:36px;border-radius:var(--radius-sm);
  background:var(--yellow);color:#000;font:700 12.5px/1 var(--font-mono);letter-spacing:.5px;text-transform:uppercase}
.cform .send:disabled{opacity:.5;cursor:default}
.cmsg{font-size:12px;margin-top:7px;min-height:15px}
.cmsg.err{color:var(--red)}.cmsg.ok{color:var(--green)}.cmsg.pending{color:var(--muted)}

/* stany */
.skel{height:64px;border-bottom:1px solid var(--border-soft);
  background:linear-gradient(90deg,transparent,var(--surface-2),transparent);
  background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{font-family:var(--font-display);font-size:16px;color:var(--text);margin-bottom:8px}
.empty button{margin-top:14px;color:var(--link)}

/* ============ PANELE EXTRAS: GitHub Trending + LLM ============ */
.panel{margin-top:26px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:16px 18px 6px}
.panel-h{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font:700 13px/1 var(--font-display);letter-spacing:.3px;
  text-transform:uppercase;color:var(--text);margin-bottom:12px}
.panel-h i{font-style:normal;font-family:var(--font-mono);color:var(--muted);font-weight:700;font-size:10px}
.panel-h .icon{color:var(--yellow)}
.panel-h .panel-line{flex:1;height:1px;background:var(--border-soft)}
.xr-note{font:500 12px/1.5 var(--font-body);color:var(--text-2);margin-bottom:10px}
.xr-row{display:grid;grid-template-columns:minmax(150px,220px) 1fr auto;gap:12px;align-items:baseline;
  padding:12px 2px;border-bottom:1px solid var(--border-soft);transition:background var(--dur)}
.xr-row:last-child{border-bottom:none}
.xr-row:hover{background:var(--surface-2)}
.xr-name{min-width:0}
.xr-name b{font:700 13.5px/1.3 var(--font-body);color:var(--text);display:block;overflow-wrap:anywhere}
.xr-name em{font:500 10.5px/1.3 var(--font-mono);font-style:normal;color:var(--muted)}
.xr-desc{font-family:var(--font-body);font-size:13px;line-height:1.5;color:var(--text-2);min-width:0}
.xr-meta{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--font-mono);
  color:var(--text-2);white-space:nowrap}
.xr-meta .icon{color:var(--text-2)}
@media (max-width:720px){
  .xr-row{grid-template-columns:1fr auto}
  .xr-desc{grid-column:1/-1;order:3}
  .panel{padding:14px 14px 4px}
}

/* ---------- P190 POPULARNE + P191 TAGI (portal rails) ---------- */
.pop-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:baseline;
  padding:12px 2px;border-bottom:1px solid var(--border-soft);transition:background var(--dur);text-decoration:none}
.pop-row:last-child{border-bottom:none}
.pop-row:hover{background:var(--surface-2)}
.pop-rank{font:700 18px/1 var(--font-display);color:var(--text-2);text-align:center;flex:none}
.pop-t{min-width:0}
.pop-t b{display:block;font-family:var(--font-body);font-size:14.5px;font-weight:640;line-height:1.4;
  color:var(--text);overflow-wrap:anywhere}
.pop-row:hover .pop-t b{text-decoration:underline;text-decoration-color:var(--border)}
.pop-t em{font:500 10.5px/1.4 var(--font-mono);font-style:normal;color:var(--muted);text-transform:uppercase}
.pop-meta{font:600 10.5px/1 var(--font-mono);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 12px}
.tag{border:1px solid var(--border);border-radius:var(--radius-pill);padding:7px 14px;min-height:32px;
  font:600 12px/1 var(--font-mono);color:var(--text-2);cursor:pointer;background:var(--surface);
  transition:border-color var(--dur),color var(--dur);letter-spacing:.3px}
.tag:hover{border-color:var(--text);color:var(--text)}
@media (max-width:720px){
  .pop-row{grid-template-columns:24px 1fr}
  .pop-meta{display:none}
  .pop-rank{font-size:15px}
  #feed{padding:0 4px;border-radius:var(--radius-md)}
}

.termfoot{border-top:1px solid var(--border);margin-top:30px;background:var(--surface)}
.termfoot-in{max-width:var(--maxw);margin:0 auto;padding:14px 20px;
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
  font:500 10px/1.6 var(--font-mono);color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.termfoot-in kbd{border:1px solid var(--border);border-radius:3px;padding:2px 5px;color:var(--text-2)}
.termfoot-in .keys{display:flex;gap:12px;flex-wrap:wrap}
.termfoot-in .lamp{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--green);margin-right:6px;box-shadow:0 0 6px var(--green);
  animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

#toTop{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom));width:40px;height:40px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);
  display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
#toTop.show{opacity:1;pointer-events:auto}
#toTop:hover{border-color:var(--text)}

#toast{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  z-index:90;background:var(--black);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);
  font:600 12px/1.4 var(--font-mono);letter-spacing:.3px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;max-width:88vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--red)}

/* dolny pasek kanałów (mobile) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:65;background:var(--surface);
  border-top:1px solid var(--border);padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
.tabbar-in{display:flex;align-items:stretch;justify-content:space-between;gap:2px;max-width:560px;margin:0 auto}
.tabbar button{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:5px 0 4px;border-radius:var(--radius-sm);color:var(--muted);
  transition:color var(--dur),background var(--dur)}
.tabbar button .icon{width:19px;height:19px}
.tabbar button span{font:600 8px/1 var(--font-mono);letter-spacing:.4px;text-transform:uppercase;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button.on{color:var(--text);background:var(--surface-2)}
.tabbar button.on .icon{color:var(--yellow)}

@media (max-width:900px){
  .p-thumb{width:96px;height:72px}
  .post-head{grid-template-columns:1fr 96px 32px}
}
@media (max-width:720px){
  /* kompaktowy header: jedna linia */
  .mast-in{padding:9px 12px;gap:6px;align-items:center}
  .mast-logo{width:26px;height:26px;margin-right:0;border-radius:4px}
  .mast-block{font-size:13px;gap:6px}
  .mast-block::before{width:6px;height:6px}
  .mast-block .mb-news{display:none}
  .mast-side{display:none}
  .mast-tools{gap:1px}
  .mast-tools button{min-width:40px;height:40px}
  .pages-in{padding:8px 14px}
  .rail-hint{display:none}
  .tabbar{display:block}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .ticker{height:28px}
  .ticker-tag{font-size:9px;line-height:28px}
  .ticker-item{font-size:10.5px;line-height:28px}
  .day{top:28px;padding:14px 12px 8px}
  main{padding:4px 12px 24px}
  .post-head{grid-template-columns:1fr 92px;grid-template-rows:auto auto;gap:4px 12px;padding:14px 12px}
  .p-right{display:none}
  .p-body{grid-column:1;grid-row:1/3}
  .p-thumb{grid-column:2;grid-row:1/3;width:92px;height:76px}
  .p-title{font-size:16px;font-weight:660;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .p-meta{font-size:11px;gap:6px}
  .p-meta .src{display:none}
  .article p,.article .lead{font-size:15.5px;line-height:1.72}
  .body{padding:2px 12px 22px}
  .body .shot{aspect-ratio:16/10;max-height:42vh}
  .cform textarea,.cform input,.searchbar input{font-size:16px}  /* iOS nie zoomuje */
  .termfoot-in .keys{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .ticker-track{animation:none!important;transform:none!important}
}
</style>
</head>
<body>

<!-- TICKER — Bloomberg-style running headlines -->
<div class="ticker" id="tickerBar">
  <button class="ticker-tag" id="liveBtn" title="Przewiń do najnowszych depesz" aria-label="LIVE — najnowsze depesze">LIVE</button>
  <div class="ticker-run"><div class="ticker-track" id="tickerTrack">
    <span class="ticker-item">ładowanie depesz…</span>
  </div></div>
</div>

<!-- MASTHEAD — telegazeta blok -->
<header class="masthead">
  <div class="mast-in">
    <img class="mast-logo" src="/images/aie-logo.png" alt="Logo AI Evolution Polska" width="38" height="38">
    <span class="mast-block"><span class="mb-ai">AI EVOLUTION</span><span class="mb-news">NEWS</span></span>
    <div class="mast-side">
      <span class="sub">TERMINAL INFORMACYJNY · PL</span>

      <button id="hotBtn" title="Tylko gorące" aria-label="Tylko gorące" aria-pressed="false" style="position:relative"><svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-flame"/></svg></button>
      <button id="savedBtn" title="Zapisane" aria-label="Zapisane" aria-pressed="false" style="position:relative"><svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-star"/></svg><span class="badge" id="savedBadge" hidden>0</span></button>
      <button id="searchBtn" title="Szukaj (/)" aria-label="Szukaj" aria-pressed="false"><svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-search"/></svg></button>
      <button id="refreshBtn" title="Odśwież" aria-label="Odśwież"><svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-refresh"/></svg></button>
    </div>
  </div>
</header>

<!-- PAGES — pasek kanałów P100.. jak w telegazecie -->
<nav class="pages" id="rail" aria-label="Kanały tematyczne"><div class="pages-in" id="railIn"></div></nav>

<div class="searchbar" id="searchWrap">
  <form onsubmit="return false">
    <svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#luc-search"/></svg>
    <input id="q" type="search" placeholder="szukaj: bitcoin, openai, gta 6, swiat…" autocomplete="off" aria-label="Szukaj depesz">
    <button class="esc" id="qClear" type="button">ESC</button>
  </form>
</div>

<main>
  <div class="statusbar" id="metaLine"><span>ładowanie depesz…</span></div>
  <div id="feed">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
  <div id="extras"></div>
</main>

<footer class="termfoot">
  <div class="termfoot-in">
    <span><span class="lamp"></span>ONLINE · © 2026 AI EVOLUTION NEWS · <b id="themeHint" style="color:var(--text)">LIGHT MODE</b></span>
    <span class="keys">
      <span><kbd>/</kbd> SZUKAJ</span>
      <span><kbd>J</kbd><kbd>K</kbd> NAWIGACJA</span>
      <span><kbd>ENTER</kbd> ROZWIŃ</span>
      <span><kbd>S</kbd> ZAPISZ</span>
    </span>
  </div>
</footer>

<nav class="tabbar" id="tabbar" aria-label="Kanały — dolna nawigacja">
  <div class="tabbar-in" id="tabbarIn"></div>
</nav>

<button id="toTop" aria-label="Do góry"><svg class="icon" aria-hidden="true"><use href="/icons.svg#luc-arrow-up"/></svg></button>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   KANAŁY — kolory telegazety: nasycone, pod czarne tło
   ============================================================ */
var CATS={
  ai:     {label:'AI',      color:'#00E7FF', icon:'luc-brain',      page:101},
  krypto: {label:'Krypto',  color:'#FFB000', icon:'luc-btc',        page:102},
  tech:   {label:'Tech',    color:'#30DB5B', icon:'luc-chip',       page:103},
  swiat:  {label:'Świat',   color:'#7E90A6', icon:'luc-globe',      page:104},
  polska: {label:'Polska',  color:'#FF4D4D', icon:'luc-flag',       page:105},
  biznes: {label:'Biznes',  color:'#2FA84F', icon:'luc-trending-up',page:106},
  nauka:  {label:'Nauka',   color:'#B98CFF', icon:'luc-atom',       page:107},
  gaming: {label:'Gaming',  color:'#FF74C6', icon:'luc-gamepad',    page:108},
  kosmos: {label:'Kosmos',  color:'#6BA3FF', icon:'luc-rocket',     page:109},
  zdrowie:{label:'Zdrowie', color:'#FF8A96', icon:'luc-heart-pulse',page:110},
  fun:    {label:'Ciekawostki',color:'#FFD23F',icon:'luc-smile',    page:111}
};
var FALLBACK={label:'Inne',color:'#7E90A6',icon:'luc-help',page:199};
var ORDER=['ai','krypto','tech','swiat','polska','biznes','nauka','gaming','kosmos','zdrowie','fun'];
function cat(id){return CATS[id]||FALLBACK;}
function ico(name,cls){return '<svg class="icon '+(cls||'icon-sm')+'" aria-hidden="true"><use href="/icons.svg#'+name+'"/></svg>';}

/* CategoryChip — reusable P101-style channel badge (nav rail + article metadata) */
function catChip(id,pageNo){
  var c=cat(id);
  return '<span class="cat-tag" style="--c:'+c.color+'"><i class="dot"></i><b>P'+(pageNo||c.page)+'</b> '+esc(c.label.toUpperCase())+'</span>';
}

var NEWS=[],META={},activeCat='all',hotOnly=false,savedOnly=false,search='';
var SAVED=new Set(),COVERS=new Map(),READY=new Set(),searchTimer=null;

/* MOTYW — light domyślnie */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('aien-theme',t);}catch(e){}
  var btn=$('themeBtn');
  if(btn){btn.classList.toggle('on',t==='dark');
    var u=btn.querySelector('use');if(u)u.setAttribute('href','/icons.svg#'+(t==='dark'?'luc-moon':'luc-sun'));}
  var h=$('themeHint');if(h)h.textContent=(t==='dark'?'DARK MODE':'LIGHT MODE');
}
function initTheme(){
  var t='light';
  try{t=localStorage.getItem('aien-theme')||'light';}catch(e){}
  applyTheme(t==='dark'?'dark':'light');
}

/* LIVE — przewiń do najnowszych depesz */
function goLive(){
  activeCat='all';hotOnly=false;savedOnly=false;search='';
  var q=$('q');if(q)q.value='';
  buildRail();syncTools();render();
  window.scrollTo({top:0,behavior:'smooth'});
  toast('LIVE — NAJNOWSZE DEPESZE');
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/ł/g,'l')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function $(id){return document.getElementById(id);}
function setTag(t){
  search=t;
  activeCat='all';hotOnly=false;savedOnly=false;
  buildRail();syncTools();render();
  window.scrollTo({top:0,behavior:'smooth'});
  toast('FILTR: '+t.toUpperCase());
}

/* ZAPISANE (localStorage) */
function loadSaved(){
  try{var raw=localStorage.getItem('aien-saved');
    SAVED=new Set(raw?JSON.parse(raw).map(Number).filter(function(n){return !isNaN(n);}):[]);}
  catch(e){SAVED=new Set();}
}
function isSaved(id){return SAVED.has(Number(id));}
function toggleSaved(id){
  id=Number(id);
  var on=!SAVED.has(id);
  if(on)SAVED.add(id);else SAVED.delete(id);
  try{localStorage.setItem('aien-saved',JSON.stringify([].concat(Array.from(SAVED))));}catch(e){}
  document.querySelectorAll('[data-save="'+id+'"]').forEach(function(b){
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
    var l=b.querySelector('.lbl');if(l)l.textContent=on?'Zapisane':'Zapisz';
  });
  syncTools();
  if(savedOnly)render();
  toast(on?'ZAPISANO':'USUNIĘTO');
}

/* OKŁADKI SVG — deterministyczna geometria w kolorze kanału, zero liter */
function hash(n){var h=(n*2654435761)>>>0;h^=h>>>13;h=(h*1274126177)>>>0;return h;}
function shade(hex,amt){
  var c=hex.replace('#',''),num=parseInt(c,16);
  var r=(num>>16)&255,g=(num>>8)&255,b=num&255;
  function m(v){return Math.max(0,Math.min(255,Math.round(v+(amt<0?v:255-v)*amt)));}
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);
}
var MOTIF={ai:'circuit',tech:'circuit',krypto:'bars',biznes:'bars',
  kosmos:'orbit',swiat:'orbit',polska:'orbit',
  nauka:'wave',zdrowie:'wave',gaming:'grid',fun:'grid'};
function coverFor(n){
  var key=n.id+':'+n.category;
  if(COVERS.has(key))return COVERS.get(key);
  var c=cat(n.category),base=(c.color==='#FFFFFF'?'#9AA8B6':c.color),h=hash(n.id||1);
  var dark=shade(base,-0.88),mid=shade(base,-0.64),light=shade(base,0.18);
  var motif=MOTIF[n.category]||'grid';
  var cx=140+(h%520),cy=90+((h>>7)%270);
  var art='';
  if(motif==='circuit'){
    for(var i=0;i<9;i++){
      var hh=hash((n.id||1)*31+i);
      var y=30+(hh%390),x=(hh>>9)%420,len=120+((hh>>15)%260),br=40+((hh>>5)%90);
      art+='<path d="M'+x+' '+y+'h'+len+'l'+br+' '+(hh%2?br:-br)+'h'+(70+(hh>>11)%120)+'" '
        +'fill="none" stroke="'+base+'" stroke-opacity=".30" stroke-width="1.5"/>'
        +'<circle cx="'+(x+len)+'" cy="'+y+'" r="3.2" fill="'+base+'" fill-opacity=".55"/>';
    }
  }else if(motif==='bars'){
    for(var b2=0;b2<22;b2++){
      var hb=hash((n.id||1)*17+b2),bh=40+(hb%300);
      art+='<rect x="'+(28+b2*35)+'" y="'+(420-bh)+'" width="16" height="'+bh+'" rx="2" '
        +'fill="'+base+'" fill-opacity="'+(0.10+(hb%5)*0.045).toFixed(3)+'"/>';
    }
    art+='<path d="M28 300 L 220 210 L 400 260 L 560 130 L 772 180" fill="none" '
      +'stroke="'+base+'" stroke-opacity=".62" stroke-width="2.4"/>';
  }else if(motif==='orbit'){
    for(var o=0;o<4;o++){
      art+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(70+o*78)+'" ry="'+(28+o*32)+'" '
        +'transform="rotate('+((h>>o)%70-35)+' '+cx+' '+cy+')" fill="none" stroke="'+base+'" '
        +'stroke-opacity="'+(0.42-o*0.08).toFixed(2)+'" stroke-width="1.4"/>';
    }
    art+='<circle cx="'+cx+'" cy="'+cy+'" r="30" fill="'+base+'" fill-opacity=".28"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="14" fill="'+base+'" fill-opacity=".55"/>';
  }else if(motif==='wave'){
    for(var w=0;w<7;w++){
      var amp=18+((h>>w)%46),off=60+w*52;
      art+='<path d="M-20 '+off+' Q 180 '+(off-amp)+' 400 '+off+' T 820 '+off+'" fill="none" '
        +'stroke="'+base+'" stroke-opacity="'+(0.5-w*0.05).toFixed(2)+'" stroke-width="1.6"/>';
    }
  }else{
    for(var g=0;g<30;g++){
      var hg=hash((n.id||1)*53+g),s=26+(hg%64);
      art+='<rect x="'+(hg%740)+'" y="'+((hg>>9)%390)+'" width="'+s+'" height="'+s+'" rx="4" '
        +'transform="rotate('+((hg>>5)%45)+' '+(hg%740)+' '+((hg>>9)%390)+') " '
        +'fill="none" stroke="'+base+'" stroke-opacity="'+(0.14+(hg%5)*0.05).toFixed(3)+'" stroke-width="1.3"/>';
    }
  }
  var grid='';
  for(var x2=0;x2<=800;x2+=50)grid+='<path d="M'+x2+' 0V450" stroke="#fff" stroke-opacity=".035"/>';
  for(var y2=0;y2<=450;y2+=50)grid+='<path d="M0 '+y2+'H800" stroke="#fff" stroke-opacity=".035"/>';
  var pageNo='P'+(c.page||199);
  var mark='<text x="26" y="410" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="30" '
    +'font-weight="700" letter-spacing="1" fill="'+light+'" fill-opacity=".38">'+pageNo+'</text>';
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">'
    +'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    +'<stop offset="0" stop-color="'+mid+'"/><stop offset="1" stop-color="'+dark+'"/></linearGradient>'
    +'<radialGradient id="r" cx="'+Math.round(cx/8)+'%" cy="'+Math.round(cy/4.5)+'%" r="72%">'
    +'<stop offset="0" stop-color="'+light+'" stop-opacity=".28"/>'
    +'<stop offset="1" stop-color="'+dark+'" stop-opacity="0"/></radialGradient></defs>'
    +'<rect width="800" height="450" fill="'+dark+'"/>'
    +'<rect width="800" height="450" fill="url(#g)"/>'+grid+art
    +'<rect width="800" height="450" fill="url(#r)"/>'+mark+'</svg>';
  var uri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  COVERS.set(key,uri);
  return uri;
}
function imgFor(n){return n.image||coverFor(n);}

/* FORMATOWANIE */
var MONTHS=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia',
  'września','października','listopada','grudnia'];
function fmtDate(d){var p=String(d||'').split('-');
  return p.length===3?(+p[2])+' '+MONTHS[(+p[1])-1]+' '+p[0]:String(d||'');}
function dayDiff(d){
  var p=String(d||'').split('-');if(p.length!==3)return null;
  var then=new Date(+p[0],+p[1]-1,+p[2]),now=new Date();
  return Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-then)/86400000);
}
function relDays(d){
  var diff=dayDiff(d);if(diff==null)return '';
  if(diff<=0)return 'dziś';if(diff===1)return 'wczoraj';
  if(diff<7)return diff+' dni temu';
  if(diff<30)return Math.floor(diff/7)+' tyg. temu';
  return fmtDate(d);
}
function dayLabel(d){
  var diff=dayDiff(d);
  if(diff===0)return 'DZIŚ · '+fmtDate(d);
  if(diff===1)return 'WCZORAJ · '+fmtDate(d);
  return fmtDate(d);
}
function readMins(n){
  var w=String(n.full||n.excerpt||'').trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1,Math.ceil(w/170));
}
function isUrl(s){return /^https?:\/\//i.test(String(s||''));}

/* ZEGAR terminala */
function tickClock(){
  var n=new Date();
  var t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
  var el=$('clock');
  if(el)el.textContent='DATA '+n.toLocaleDateString('pl-PL')+' · '+t+' CET · P100 Wszystkie';
}
setInterval(tickClock,1000);

/* DANE */
function loadData(){
  fetch('/api/news',{headers:{Accept:'application/json'}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .catch(function(){return fetch('/seed-news.json').then(function(r){return r.json();});})
    .then(function(d){
      NEWS=Array.isArray(d.news)?d.news:[];META=d.meta||{};
      buildRail();render();buildTicker();syncTools();openFromHash();buildExtras();
    })
    .catch(function(e){
      $('feed').innerHTML='<div class="empty"><h3>BŁĄD POŁĄCZENIA</h3><p>'+esc(e.message||'?')+'</p></div>';

/* FILTROWANIE */
function filtered(){
  var list=activeCat==='all'?NEWS:NEWS.filter(function(n){return n.category===activeCat;});
  if(hotOnly)list=list.filter(function(n){return n.hot;});
  if(savedOnly)list=list.filter(function(n){return isSaved(n.id);});
  if(search){
    var words=norm(search).split(/\s+/).filter(Boolean);
    list=list.filter(function(n){
      var hay=norm(n.title+' '+(n.excerpt||'')+' '+(n.full||'')+' '+(n.source||'')+' '+cat(n.category).label);
      return words.every(function(w){return hay.indexOf(w)>-1;});
    });
  }
  return list.slice().sort(function(a,b){
    var dd=String(b.date||'').localeCompare(String(a.date||''));
    if(dd)return dd;
    var ha=a.hot?1:0,hb=b.hot?1:0;
    if(ha!==hb)return hb-ha;
    if(SAVED.has(Number(a.id))!==SAVED.has(Number(b.id)))return SAVED.has(Number(a.id))?-1:1;
    return (b.id||0)-(a.id||0);
  });
}

/* TICKER — nagłówki bieżą */
function buildTicker(){
  var hot=NEWS.filter(function(n){return n.hot;});
  var list=(hot.length?hot:NEWS).slice(0,14);
  if(!list.length)return;
  var one=list.map(function(n){
    return '<span class="ticker-item" data-tick="'+n.id+'"><b>'+cat(n.category).label.toUpperCase()+'</b>'+esc(n.title)+'</span>';
  }).join('');
  /* dwie kopie = płynna pętla, seamless w overflow:hidden */
  $('tickerTrack').innerHTML=one+one;
  var track=$('tickerTrack');
  requestAnimationFrame(function(){
    var w1=track.scrollWidth/2;
    if(!w1)return;
    var reduced=false;
    try{reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
    /* stała prędkość ~38px/s, spięta w widełkach 25–40s niezależnie od długości treści */
    var dur=Math.max(25,Math.min(40,w1/38));
    track.style.animationDuration=dur.toFixed(1)+'s';
    var animOK=getComputedStyle(track).animationName!=='none';
    if(animOK||reduced)return;
    /* fallback JS scroll: stare przeglądarki / animacje wyłączone — również LEFT→RIGHT */
    var x=-w1;
    setInterval(function(){
      x+=0.6;if(x>=0)x=-w1;
      track.style.transform='translateX('+x+'px)';
    },16);
  });
}

function render(){

  var hotN=list.filter(function(n){return n.hot;}).length;
  m.push('<span>DEPESZE: <b>'+list.length+'</b></span>');
  if(hotN)m.push('<span>HOT: <b>'+hotN+'</b></span>');
  if(activeCat!=='all')m.push('<span class="chip">KANAŁ: '+esc(cat(activeCat).label.toUpperCase())+'</span>');
  if(hotOnly)m.push('<span class="chip">TYLKO HOT</span>');
  if(savedOnly)m.push('<span class="chip">ZAPISANE</span>');
  if(search)m.push('<span class="chip">„'+esc(search)+'”</span>');
  if(META.last_updated)m.push('<span class="chip">UPDATE '+esc(fmtDate(META.last_updated))+'</span>');
  if(activeCat!=='all'||hotOnly||savedOnly||search)
    m.push('<button class="reset" id="resetBtn">WYCZYŚĆ FILTRY</button>');
  $('metaLine').innerHTML=m.join('<span>·</span>');
  $('metaLine').style.display=m.length?'':'none';

  if(!list.length){
    $('feed').innerHTML='<div class="empty"><h3>BRAK DEPESZ</h3>'
      +'<p>Nic nie pasuje do wybranych filtrów.</p>'
      +'<button id="resetBtn2">POKAŻ WSZYSTKIE</button></div>';
    READY.clear();return;
  }
  var html='',lastDay='',idx=0;
  list.forEach(function(n){
    idx++;
    if(n.date!==lastDay){lastDay=n.date;html+='<div class="day"><b>◆</b>'+dayLabel(n.date)+'</div>';}
    html+='<article class="post" data-news="'+n.id+'" id="news-'+n.id+'" tabindex="0">'
      +ArticleRow(n,idx)+'<div class="body"></div></article>';
  });
  $('feed').innerHTML=html;
  READY.clear();
}

/* ROZWIJANIE */
function newsById(id){
  id=Number(id);
  for(var i=0;i<NEWS.length;i++)if(Number(NEWS[i].id)===id)return NEWS[i];
  return null;
}
function toggle(el,force){
  var id=Number(el.dataset.news),open=force==null?!el.classList.contains('open'):force;
  if(open&&!READY.has(id)){
    var n=newsById(id);if(!n)return;
    el.querySelector('.body').innerHTML=bodyHTML(n);
    READY.add(id);
    loadComments(id);
  }
  el.classList.toggle('open',open);
  el.querySelector('.post-head').setAttribute('aria-expanded',open?'true':'false');
  if(open){try{history.replaceState(null,'','#news-'+id);}catch(e){}}
}
function headOffset(){return (document.querySelector('.ticker')||{offsetHeight:30}).offsetHeight+8;}
function scrollToEl(el){
  window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-headOffset())});
}
function jumpTo(id){
  var n=newsById(id);if(!n)return;
  if(activeCat!=='all'&&n.category!==activeCat)activeCat='all';
  if(hotOnly&&!n.hot)hotOnly=false;
  if(savedOnly&&!isSaved(n.id))savedOnly=false;
  if(search){search='';$('q').value='';}
  buildRail();syncTools();render();
  requestAnimationFrame(function(){
    var el=document.querySelector('[data-news="'+n.id+'"]');if(!el)return;
    toggle(el,true);scrollToEl(el);el.focus({preventScroll:true});
  });
}
function openFromHash(){
  var m=/^#news-(\d+)$/.exec(location.hash||'');
  if(m)jumpTo(+m[1]);
}

/* KOMENTARZE */
function loadComments(id){
  fetch('/api/comments?news='+id)
    .then(function(r){return r.json();})
    .then(function(d){
      var list=d.comments||[];
      document.querySelectorAll('[data-news="'+id+'"]').forEach(function(card){
        var box=card.querySelector('.clist');if(!box)return;
        box.innerHTML=list.length?list.map(function(cm){
          var a=String(cm.author||'Anonim');
          return '<div class="cmt"><div class="cmt-h">'
            +'<span class="cmt-av">'+esc(a.slice(0,1).toUpperCase())+'</span>'
            +'<span class="cmt-a">'+esc(a)+'</span>'
            +'<span class="cmt-d">'+esc(cm.date||'')+(cm.time?' · '+esc(cm.time):'')+'</span></div>'
            +'<div class="cmt-b">'+esc(cm.content)+'</div></div>';
        }).join(''):'<div class="no-cmt">Brak komentarzy — bądź pierwszy.</div>';
        var cn=card.querySelector('.cn');if(cn)cn.textContent=list.length?'('+list.length+')':'';
      });
    })
    .catch(function(){
      document.querySelectorAll('[data-news="'+id+'"] .clist').forEach(function(el){
        el.innerHTML='<div class="no-cmt">Nie udało się wczytać komentarzy.</div>';});
    });
}
function sendComment(id,btn){
  var card=btn.closest('[data-news]');
  var ta=card.querySelector('.cform textarea'),au=card.querySelector('.cform input'),
      msg=card.querySelector('.cmsg');
  var content=(ta.value||'').trim();
  if(!content){msg.className='cmsg err';msg.textContent='Wpisz treść komentarza.';ta.focus();return;}
  btn.disabled=true;msg.className='cmsg pending';msg.textContent='Wysyłanie…';
  fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({newsId:Number(id),author:au.value||'Anonim',content:content})})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(res){
      if(!res.ok){msg.className='cmsg err';msg.textContent=res.d.error||'Błąd.';
        toast(res.d.error||'Błąd dodawania komentarza',true);return;}
      ta.value='';msg.className='cmsg ok';msg.textContent='✓ Komentarz dodany';
      toast('KOMENTARZ DODANY');loadComments(id);
      setTimeout(function(){msg.textContent='';},4000);
    })
    .catch(function(){msg.className='cmsg err';msg.textContent='Błąd sieci.';})
    .then(function(){btn.disabled=false;});
}

/* DROBIAZGI */
var toastTimer=null;
function toast(msg,isErr){
  var t=$('toast');t.textContent=msg;t.className=(isErr?'err ':'')+'show';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='';},2400);
}
function shareNews(id){
  var n=newsById(id),url=location.origin+location.pathname+'#news-'+id;
  if(navigator.share){
    navigator.share({title:n?n.title:'AI Evolution News',url:url}).catch(function(){});
    return;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url)
      .then(function(){toast('LINK SKOPIOWANY');})
      .catch(function(){toast(url);});
  }else toast(url);
}

function moveFocus(dir){
  var items=[].slice.call(document.querySelectorAll('.post'));

  var i=cur?items.indexOf(cur)+dir:0;

  });
  $('liveBtn').addEventListener('click',goLive);
  $('searchBtn').addEventListener('click',function(){toggleSearch();});
  $('qClear').addEventListener('click',function(){toggleSearch(false);});
  $('refreshBtn').addEventListener('click',function(){
    toast('ODŚWIEŻANIE…');
    loadData();
  });

  $('q').addEventListener('input',function(){
    clearTimeout(searchTimer);
    var v=this.value;
    searchTimer=setTimeout(function(){search=v.trim();render();},200);
  });

  function pickCat(cat){
    if(cat==='__more'){
      window.scrollTo({top:0});
      toast('Wybierz kanał w pasku P100 u góry — przewiń w bok');
      return;
    }
    activeCat=cat;buildRail();render();
    window.scrollTo({top:0});
  }
  $('rail').addEventListener('click',function(e){
    var b=e.target.closest('[data-cat]');if(!b)return;
    pickCat(b.dataset.cat);
  });
  $('tabbar').addEventListener('click',function(e){
    var b=e.target.closest('[data-cat]');if(!b)return;
    pickCat(b.dataset.cat);
  });
  $('tickerTrack').addEventListener('click',function(e){
    var it=e.target.closest('[data-tick]');if(!it)return;
    jumpTo(Number(it.dataset.tick));
  });

  $('feed').addEventListener('click',function(e){
    var send=e.target.closest('[data-send]');
    if(send){sendComment(send.dataset.send,send);return;}
    var save=e.target.closest('[data-save]');
    if(save){e.stopPropagation();toggleSaved(save.dataset.save);return;}
    var share=e.target.closest('[data-share]');
    if(share){e.stopPropagation();shareNews(share.dataset.share);return;}
    if(e.target.closest('.body'))return;
    var post=e.target.closest('.post');if(!post)return;
    toggle(post);
  });

  document.addEventListener('click',function(e){
    if(e.target.id==='resetBtn'||e.target.id==='resetBtn2')resetFilters();
    var tag=e.target.closest('[data-tag]');
    if(tag){setTag(tag.dataset.tag);return;}
    var pop=e.target.closest('[data-pop]');
    if(pop){e.preventDefault();jumpTo(Number(pop.dataset.pop));return;}
  });

  document.addEventListener('keydown',function(e){
    var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)
      ||document.activeElement.isContentEditable;
    if(e.key==='Escape'){
      if(document.activeElement===$('q')){toggleSearch(false);$('q').blur();return;}
    }
    if(typing)return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==='/'){e.preventDefault();toggleSearch(true);return;}
    if(e.key==='j'||e.key==='J'){e.preventDefault();moveFocus(1);return;}
    if(e.key==='k'||e.key==='K'){e.preventDefault();moveFocus(-1);return;}
    var post=document.activeElement?document.activeElement.closest('.post'):null;
    if(!post)return;
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(post);return;}
    if(e.key==='s'||e.key==='S'){e.preventDefault();toggleSaved(post.dataset.news);return;}
  });

  window.addEventListener('hashchange',openFromHash);

  var top=$('toTop');
  function onScroll(){top.classList.toggle('show',window.scrollY>800);}
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  top.addEventListener('click',function(){window.scrollTo({top:0});});
}

document.addEventListener('DOMContentLoaded',function(){initTheme();loadSaved();tickClock();setup();syncTools();buildExtras();loadData();});
</script>
</body>
</html>

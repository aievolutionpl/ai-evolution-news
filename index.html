<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Evolution News — newsy AI, krypto, tech i świat po polsku</title>
<meta name="description" content="Gęsty, czytelny przegląd newsów po polsku: AI, kryptowaluty, tech, świat, Polska, biznes, nauka, gaming, kosmos, zdrowie i ciekawostki. Każda depesza z sednem sprawy i konkretami. Bez logowania.">
<meta name="theme-color" content="#F5F7FA" id="themeColorMeta">
<meta property="og:title" content="AI Evolution News">
<meta property="og:description" content="Newsy AI, krypto, tech i świat — po polsku, bez clickbaitu. Sedno sprawy przy każdej depeszy.">
<meta property="og:image" content="/images/hero-banner.png">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFA724'/%3E%3Cpath d='M17.5 5 L9 18h5.5L13.5 27 22 14h-5.5z' fill='%230A0C0F'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/images/hero-banner.png">
<link rel="preload" href="/seed-news.json" as="fetch" crossorigin="anonymous">
<script>
/* motyw ustawiany przed pierwszym malowaniem — zero migotania */
(function(){try{var t=localStorage.getItem('aien-theme');
if(t!=='light'&&t!=='dark')t='light';
document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<style>
/* ============================================================
   AI EVOLUTION NEWS — UI v7 „czytelnia XL”
   Zasada bez zmian: news od pierwszej sekundy.
   v7: większa typografia, szersza kolumna, depesza jako karta
   z paskiem kanału, dwupoziomowy pasek nawigacji, jasny motyw
   domyślnie. Zero zewnętrznych zasobów.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  /* ---- motyw jasny (domyślny) ---- */
  --bg:#F5F7FA;
  --bg-soft:#EBEFF5;
  --surface:#FFFFFF;
  --surface-2:#EFF3F8;
  --surface-3:#E2E8F1;
  --line:#D7DEE9;
  --line-soft:#E6EBF2;
  --text:#0A0F16;
  --text-2:#3D4957;
  --muted:#5C6879;
  --accent:#B15A00;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(177,90,0,.10);
  --hot:#C0243A;
  --ok:#0B7F51;
  --shadow:0 10px 30px rgba(16,28,45,.10);
  --card-shadow:0 1px 2px rgba(16,28,45,.05);
  --r:14px;
  --r-sm:9px;

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --head-h:110px;
  --maxw:1320px;
}
[data-theme="dark"]{
  --bg:#080A0E;
  --bg-soft:#0D1116;
  --surface:#12171F;
  --surface-2:#1A212B;
  --surface-3:#232C38;
  --line:#2A3542;
  --line-soft:#1E2733;
  --text:#EDF2F8;
  --text-2:#B7C4D2;
  --muted:#8695A8;
  --accent:#FFB13D;
  --accent-ink:#0A0C10;
  --accent-soft:rgba(255,177,61,.15);
  --hot:#FF6076;
  --ok:#37D992;
  --shadow:0 18px 46px rgba(0,0,0,.6);
  --card-shadow:none;
}
/* kolory kanałów dobrano pod ciemne tło — na papierze trzeba je przyciemnić */
:root .p-meta .ch,
:root .p-ico,
:root .rail button.on,
:root .tabbar button.on,
:root .facts li::before{--cx:color-mix(in srgb,var(--c) 62%,#0A0F16)}
[data-theme="dark"] .p-meta .ch,
[data-theme="dark"] .p-ico,
[data-theme="dark"] .rail button.on,
[data-theme="dark"] .tabbar button.on,
[data-theme="dark"] .facts li::before{--cx:var(--c)}

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);
  font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  padding-bottom:56px;
}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.85;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-xs{width:15px;height:15px}
.icon-sm{width:18px;height:18px}

/* ---------- pasek postępu czytania ---------- */
#progress{position:fixed;inset:0 auto auto 0;height:3px;width:0;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#fff));
  z-index:70;transition:width .12s linear}

/* ============================================================
   NAWIGACJA — dwa poziomy: marka + narzędzia, potem kanały
   ============================================================ */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;height:62px;
  display:flex;align-items:center;gap:14px;padding:0 22px}

/* ---------- logo: czysty znak + logotyp ---------- */
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex:none}
.brand .mk{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:0 3px 12px color-mix(in srgb,var(--accent) 38%,transparent)}
.brand .mk .icon{width:22px;height:22px;stroke-width:2.3}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand b{font-size:16.5px;font-weight:750;letter-spacing:.3px;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}
.brand .sub{font:700 9.5px/1 var(--mono);letter-spacing:1.8px;color:var(--muted);margin-top:4px}

.spacer{flex:1 1 auto}

.tools{display:flex;align-items:center;gap:4px;flex:none}
.tools button{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:var(--muted);transition:background .14s,color .14s;position:relative;
  border:1px solid transparent}
.tools button:hover{background:var(--surface);color:var(--text);border-color:var(--line)}
.tools button.on{color:var(--accent);background:var(--accent-soft);
  border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tools .badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 10px/16px var(--mono);
  text-align:center}

/* ---------- drugi poziom: kanały z etykietami i licznikiem ---------- */
.railwrap{border-top:1px solid var(--line-soft);background:color-mix(in srgb,var(--bg-soft) 70%,transparent)}
.rail{max-width:var(--maxw);margin:0 auto;padding:8px 22px;display:flex;align-items:center;gap:5px;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
.rail::-webkit-scrollbar{display:none}
.rail button{height:34px;padding:0 13px;border-radius:10px;display:flex;align-items:center;gap:8px;
  color:var(--muted);transition:background .14s,color .14s,border-color .14s;flex:none;
  font-size:13.5px;font-weight:650;letter-spacing:.1px;white-space:nowrap;
  border:1px solid transparent}
.rail button .ct{font:700 11px/1 var(--mono);opacity:.6}
.rail button:hover{background:var(--surface);color:var(--text);border-color:var(--line)}
.rail button.on{color:var(--cx,var(--accent));
  background:color-mix(in srgb,var(--c,var(--accent)) 13%,var(--surface));
  border-color:color-mix(in srgb,var(--c,var(--accent)) 45%,transparent)}
.rail .sep{width:1px;height:20px;background:var(--line);margin:0 7px;flex:none}

/* wyszukiwarka — schowana, dopóki nie jest potrzebna */
.searchwrap{display:none;border-top:1px solid var(--line-soft);background:var(--surface)}
.searchwrap.show{display:block}
.searchwrap form{max-width:var(--maxw);margin:0 auto;padding:12px 22px;display:flex;
  align-items:center;gap:12px}
.searchwrap .icon{color:var(--muted)}
.searchwrap input{flex:1;background:none;border:none;outline:none;font-size:17px;padding:3px 0}
.searchwrap input::placeholder{color:var(--muted)}
.searchwrap .esc{font:700 11px/1 var(--mono);color:var(--muted);border:1px solid var(--line);
  border-radius:6px;padding:5px 8px}

/* ============================================================
   STRUMIEŃ DEPESZ
   ============================================================ */
main{max-width:var(--maxw);margin:0 auto;padding:0 22px}

.meta-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:20px 4px 12px;font:700 12px/1 var(--mono);color:var(--muted);
  letter-spacing:.7px;text-transform:uppercase}
.meta-line b{color:var(--text)}
.meta-line .q-chip{text-transform:none;letter-spacing:0;color:var(--text-2)}
.meta-line .reset{color:var(--accent);text-transform:none;letter-spacing:0;
  font-family:var(--sans);font-size:14px;font-weight:600}
.meta-line .reset:hover{text-decoration:underline}

.day{position:sticky;top:var(--head-h);z-index:20;
  background:var(--bg);
  padding:14px 4px 8px;font:700 11.5px/1 var(--mono);color:var(--muted);
  letter-spacing:1.3px;text-transform:uppercase;margin-bottom:8px;
  display:flex;align-items:center;gap:12px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day b{color:var(--accent)}

/* depesza = karta z paskiem kanału — koniec zlewania się wierszy */
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;position:relative;box-shadow:var(--card-shadow);
  transition:border-color .14s,box-shadow .14s;
  content-visibility:auto;contain-intrinsic-size:auto 150px}
.post::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--c);opacity:.85}
.post:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:var(--shadow)}
.post.open{content-visibility:visible;border-color:color-mix(in srgb,var(--c) 55%,var(--line));
  box-shadow:var(--shadow)}
.post:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.post-head{width:100%;display:grid;grid-template-columns:36px 1fr 132px auto;gap:16px;
  align-items:start;padding:18px 18px 18px 20px;text-align:left;transition:background .13s}
.post-head:hover{background:color-mix(in srgb,var(--c) 4%,transparent)}

.p-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  color:var(--cx,var(--c));background:color-mix(in srgb,var(--c) 14%,transparent);margin-top:2px}
.p-ico .icon{width:20px;height:20px}

.p-body{display:block;min-width:0}
.p-title{display:block;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.35px;
  color:var(--text);margin-bottom:7px;overflow-wrap:anywhere}
.post.open .p-title{color:var(--accent)}
/* zajawka w wierszu — widać, o co chodzi, bez klikania */
.p-dek{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:15.5px;line-height:1.55;color:var(--text-2);margin-bottom:11px}
.post.open .p-dek{display:none}
.p-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font:700 12px/1.4 var(--mono);color:var(--muted);letter-spacing:.2px}
.p-meta .ch{color:var(--cx,var(--c))}
.p-meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.45}
.p-meta .hot{color:var(--hot);letter-spacing:.7px;
  background:color-mix(in srgb,var(--hot) 13%,transparent);
  padding:3px 7px;border-radius:5px}

.p-right{display:flex;align-items:center;gap:3px;color:var(--muted)}
.p-right .act{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--muted);transition:background .13s,color .13s}
.p-right .act:hover{background:var(--surface-2);color:var(--text)}
.p-right .act.on{color:var(--accent)}
.p-right .act.on .icon{fill:var(--accent)}
.p-right .chev{transition:transform .22s ease;width:34px;height:34px;display:grid;place-items:center}
.post.open .p-right .chev{transform:rotate(180deg);color:var(--accent)}

/* miniaturka: prawdziwe zdjęcie albo lekki gradient kanału (zero requestów) */
.p-thumb{width:132px;height:92px;border-radius:11px;overflow:hidden;flex:none;margin-top:2px;
  border:1px solid var(--line-soft);position:relative;
  background:
    radial-gradient(120% 100% at 20% 0%,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%),
    linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--surface-2)),var(--surface-2))}
.p-thumb img{width:100%;height:100%;object-fit:cover}
.p-thumb .gl{position:absolute;inset:0;display:grid;place-items:center;color:var(--c);opacity:.55}
.p-thumb .gl .icon{width:28px;height:28px}

/* ---------- rozwinięta depesza ---------- */
.body{display:none;padding:0 22px 30px 24px}
.post.open .body{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.body .shot{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2);margin:4px 0 24px;aspect-ratio:16/9;
  max-width:70ch;max-height:min(44vh,380px)}
.body .shot img{width:100%;height:100%;object-fit:cover}

.article{max-width:70ch}
.article .lead{font-size:19px;line-height:1.55;color:var(--text);font-weight:500;
  margin-bottom:22px;padding-left:17px;border-left:3px solid var(--accent)}
.article p{font-size:17.5px;line-height:1.72;color:var(--text-2);margin-bottom:18px}
.article p:last-child{margin-bottom:0}

/* ---------- SEDNO SPRAWY ---------- */
.gist{max-width:70ch;margin:0 0 20px;padding:17px 19px;border-radius:var(--r);
  background:color-mix(in srgb,var(--accent) 10%,var(--surface));
  border:1px solid color-mix(in srgb,var(--accent) 34%,var(--line))}
.gist h4{display:flex;align-items:center;gap:8px;font:700 11px/1 var(--mono);
  letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.gist p{font-size:17px;line-height:1.55;color:var(--text);font-weight:550}

/* ---------- KONKRETY ---------- */
.facts{max-width:70ch;margin:0 0 24px}
.facts h4{display:flex;align-items:center;gap:8px;font:700 11px/1 var(--mono);
  letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.facts li{list-style:none;position:relative;padding:7px 0 7px 22px;
  font-size:16.5px;line-height:1.55;color:var(--text-2)}
.facts li::before{content:"";position:absolute;left:2px;top:16px;width:7px;height:7px;
  border-radius:2px;background:var(--cx,var(--c,var(--accent)))}

/* ---------- tagi ---------- */
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.tags button,.tags span{cursor:pointer;font:650 12px/1 var(--mono);letter-spacing:.2px;
  color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 11px;
  transition:border-color .13s,color .13s,background .13s}
.tags button:hover,.tags span:hover{color:var(--accent);border-color:var(--accent);
  background:var(--accent-soft)}
.p-tags{margin-top:11px}
.p-tags span{padding:4px 9px;font-size:11.5px}

.srcline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px;
  font:650 13px/1 var(--mono);color:var(--muted)}
.srcline b{color:var(--text-2)}
.srcline a{color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.srcline a:hover{text-decoration:underline}

.rowtools{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.rowtools button{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;
  border:1px solid var(--line);border-radius:99px;font-size:14px;color:var(--text-2);
  transition:border-color .13s,color .13s,background .13s}
.rowtools button:hover{border-color:var(--accent);color:var(--accent)}
.rowtools button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rowtools button.on .icon{fill:var(--accent)}

.sub{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);max-width:70ch}
.sub h4{display:flex;align-items:center;gap:8px;font:700 11px/1 var(--mono);
  letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.q{padding:11px 0 11px 18px;border-left:3px solid var(--line);color:var(--text-2);
  font-size:16.5px;line-height:1.55}
.q+.q{margin-top:3px}

/* ---------- komentarze ---------- */
.cmt{padding:13px 0;border-bottom:1px solid var(--line-soft)}
.cmt:last-child{border-bottom:none}
.cmt-h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.cmt-av{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--text-2);font:700 12px/1 var(--mono)}
.cmt-a{font-size:14.5px;font-weight:650}
.cmt-d{font:600 12px/1 var(--mono);color:var(--muted);margin-left:auto}
.cmt-b{font-size:16px;line-height:1.6;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.no-cmt{font-size:15px;color:var(--muted);padding:6px 0 12px}

.cform{margin-top:14px}
.cform textarea{width:100%;min-height:80px;resize:vertical;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;outline:none}
.cform textarea:focus{border-color:var(--accent)}
.cform .r{display:flex;gap:9px;margin-top:9px;flex-wrap:wrap}
.cform input{flex:1;min-width:160px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:11px 14px;font-size:15.5px;outline:none}
.cform input:focus{border-color:var(--accent)}
.cform .send{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:650}
.cform .send:disabled{opacity:.55;cursor:default}
.cmsg{font-size:14px;margin-top:8px;min-height:18px}
.cmsg.err{color:var(--hot)}.cmsg.ok{color:var(--ok)}.cmsg.pending{color:var(--muted)}

/* ---------- stany ---------- */
.skel{height:130px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;
  background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));
  background-size:200% 100%;animation:sh 1.25s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty h3{font-size:19px;color:var(--text);margin-bottom:10px}
.empty button{margin-top:18px;color:var(--accent);font-size:15px}
.empty button:hover{text-decoration:underline}
#sentinel{height:1px}

/* ---------- stopka ---------- */
footer{max-width:var(--maxw);margin:48px auto 0;padding:26px 22px 36px;
  border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;
  align-items:center;justify-content:space-between;
  font:600 13px/1.6 var(--mono);color:var(--muted)}
footer kbd{border:1px solid var(--line);border-radius:6px;padding:3px 7px;
  font:700 11.5px/1 var(--mono);color:var(--text-2);background:var(--surface)}
footer .keys{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ---------- do góry ---------- */
#toTop{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
  display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .18s,transform .18s;z-index:50}
#toTop.show{opacity:1;pointer-events:auto;transform:none}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:90;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  padding:12px 20px;border-radius:99px;font-size:15px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--hot);color:var(--hot)}

/* ---------- arkusz wszystkich kanałów (mobile) ---------- */
#sheet{position:fixed;inset:0;z-index:80;display:none}
#sheet.show{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(6,10,16,.55)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;background:var(--bg);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
#sheet h3{font:700 11.5px/1 var(--mono);letter-spacing:1.3px;text-transform:uppercase;
  color:var(--muted);margin-bottom:16px}
#sheet .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
#sheet .gr button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;
  border-radius:13px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);font-size:13px;font-weight:650}
#sheet .gr button.on{color:var(--cx,var(--accent));border-color:var(--c,var(--accent));
  background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--surface))}

/* ---------- dolny pasek kanałów (mobile) ---------- */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:65;
  background:color-mix(in srgb,var(--bg) 95%,transparent);
  backdrop-filter:saturate(150%) blur(14px);
  border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.tabbar-in{display:flex;align-items:stretch;justify-content:space-between;gap:3px;
  max-width:600px;margin:0 auto}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 0 5px;border-radius:11px;color:var(--muted);transition:color .14s}
.tabbar button .icon{width:23px;height:23px}
.tabbar button span{font:700 9.5px/1 var(--sans);letter-spacing:.2px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button.on{color:var(--cx,var(--accent));
  background:color-mix(in srgb,var(--c,var(--accent)) 13%,transparent)}

@media (min-width:1700px){
  :root{--maxw:1440px}
}
@media (max-width:1360px){
  :root{--maxw:1120px}
}
@media (max-width:1160px){
  :root{--maxw:920px}
}
@media (max-width:820px){
  .post-head{grid-template-columns:32px 1fr 112px auto;gap:13px}
  .p-thumb{width:112px;height:80px}
}
@media (max-width:720px){
  :root{--head-h:60px}
  main{padding:0 14px}
  .top-in{padding:0 14px;height:60px;gap:8px}
  .railwrap{display:none}
  .tabbar{display:block}
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom));font-size:16.5px}
  .brand{flex:0 1 auto;min-width:0}
  .brand .sub{display:none}
  .brand b{font-size:13px;letter-spacing:.1px;overflow:hidden;text-overflow:ellipsis}
  .brand .wm{min-width:0;overflow:hidden}
  .brand .mk{width:34px;height:34px;border-radius:10px}
  .tools{gap:1px}
  .tools button{width:36px;height:36px;border-radius:10px}
  #toTop{bottom:calc(84px + env(safe-area-inset-bottom));right:14px}
  footer{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  footer .keys{display:none}
  .post{border-radius:12px;margin-bottom:9px}
  .post-head{grid-template-columns:1fr 84px;gap:12px;padding:15px 14px 15px 16px}
  .p-ico,.p-right{display:none}
  .p-thumb{width:84px;height:84px;grid-row:span 1}
  .p-title{font-size:17.5px;line-height:1.33;letter-spacing:-.25px;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .p-dek{-webkit-line-clamp:2;font-size:14.5px;margin-bottom:9px}
  .p-meta{font-size:11.5px;gap:7px}
  .p-meta .src{display:none}
  .p-tags{display:none}
  .body{padding:0 15px 26px 17px}
  .article p,.article .lead{font-size:17px;line-height:1.75}
  .article .lead{font-size:18px}
  .gist p{font-size:16.5px}
  .facts li{font-size:16px}
  .body .shot{aspect-ratio:16/10;max-height:44vh;border-radius:11px}
  .meta-line{font-size:11px;padding:16px 2px 10px}
  .day{font-size:11px;padding:12px 2px 6px}
  .rowtools button{padding:11px 16px}
  .cform textarea,.cform input{font-size:16px}  /* 16px = iOS nie zoomuje */
  .searchwrap input{font-size:16px}
  .searchwrap form{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   KANAŁY — kolor + ikona + etykieta
   ============================================================ */
var CATS={
  ai:     {label:'AI',          color:'#8B9BFF', icon:'luc-brain'},
  krypto: {label:'Krypto',      color:'#FFA724', icon:'luc-btc'},
  tech:   {label:'Tech',        color:'#3FD8F0', icon:'luc-chip'},
  swiat:  {label:'Świat',       color:'#19D6C4', icon:'luc-globe'},
  polska: {label:'Polska',      color:'#FF6B6B', icon:'luc-flag'},
  biznes: {label:'Biznes',      color:'#3FDC86', icon:'luc-trending-up'},
  nauka:  {label:'Nauka',       color:'#BB92FF', icon:'luc-atom'},
  gaming: {label:'Gaming',      color:'#FF74C6', icon:'luc-gamepad'},
  kosmos: {label:'Kosmos',      color:'#6BA3FF', icon:'luc-rocket'},
  zdrowie:{label:'Zdrowie',     color:'#FF8A96', icon:'luc-heart-pulse'},
  fun:    {label:'Ciekawostki', color:'#FFD23F', icon:'luc-smile'}
};
var FALLBACK={label:'Inne',color:'#7E90A6',icon:'luc-help'};
var ORDER=['ai','krypto','tech','swiat','polska','biznes','nauka','gaming','kosmos','zdrowie','fun'];
function cat(id){return CATS[id]||FALLBACK;}
function ico(name,cls){return '<svg class="icon '+(cls||'icon-sm')+'" aria-hidden="true"><use href="/icons.svg#'+name+'"/></svg>';}

var NEWS=[],META={},activeCat='all',hotOnly=false,savedOnly=false,search='';
var SAVED=new Set(),COVERS=new Map(),READY=new Set(),searchTimer=null;
var VIEW=[],shown=0,PAGE=24,io=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
/* „Świat" == „swiat", „Łódź" == „lodz" */
function norm(s){return String(s==null?'':s).toLowerCase().replace(/ł/g,'l')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function $(id){return document.getElementById(id);}

/* ============================================================
   ZAPISANE (localStorage)
   ============================================================ */
function loadSaved(){
  try{var raw=localStorage.getItem('aien-saved');
    SAVED=new Set(raw?JSON.parse(raw).map(Number).filter(function(n){return !isNaN(n);}):[]);}
  catch(e){SAVED=new Set();}
}
function isSaved(id){return SAVED.has(Number(id));}
function toggleSaved(id){
  id=Number(id);
  var on=!SAVED.has(id);
  if(on)SAVED.add(id);else SAVED.delete(id);
  try{localStorage.setItem('aien-saved',JSON.stringify(Array.from(SAVED)));}catch(e){}
  document.querySelectorAll('[data-save="'+id+'"]').forEach(function(b){
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
    var l=b.querySelector('.lbl');if(l)l.textContent=on?'Zapisane':'Zapisz';
  });
  syncTools();
  if(savedOnly)render();
  toast(on?'Zapisano na później':'Usunięto z zapisanych');
}

/* ============================================================
   OKŁADKI — abstrakcyjna grafika SVG dla depesz bez zdjęcia.
   Budowana leniwie: tylko dla depeszy faktycznie rozwiniętej,
   więc lista 130+ pozycji nie generuje ani jednej.
   ============================================================ */
function hash(n){var h=(n*2654435761)>>>0;h^=h>>>13;h=(h*1274126177)>>>0;return h;}
function shade(hex,amt){
  var c=hex.replace('#',''),num=parseInt(c,16);
  var r=(num>>16)&255,g=(num>>8)&255,b=num&255;
  function m(v){return Math.max(0,Math.min(255,Math.round(v+(amt<0?v:255-v)*amt)));}
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);
}
var MOTIF={ai:'circuit',tech:'circuit',krypto:'bars',biznes:'bars',
  kosmos:'orbit',swiat:'orbit',polska:'orbit',
  nauka:'wave',zdrowie:'wave',gaming:'grid',fun:'grid'};
function coverFor(n){
  var lightUI=document.documentElement.getAttribute('data-theme')!=='dark';
  var key=n.id+':'+n.category+':'+(lightUI?'l':'d');
  if(COVERS.has(key))return COVERS.get(key);
  var c=cat(n.category),base=c.color,h=hash(n.id||1);
  var dark=lightUI?shade(base,0.92):shade(base,-0.86);
  var mid=lightUI?shade(base,0.78):shade(base,-0.62);
  var light=lightUI?shade(base,0.45):shade(base,0.18);
  var ink=lightUI?'#0A0F16':'#fff';
  var strokeBase=lightUI?shade(base,-0.35):base;
  var motif=MOTIF[n.category]||'grid';
  base=strokeBase;
  var cx=140+(h%520),cy=90+((h>>7)%270);
  var art='';

  if(motif==='circuit'){
    for(var i=0;i<9;i++){
      var hh=hash((n.id||1)*31+i);
      var y=30+(hh%390),x=(hh>>9)%420,len=120+((hh>>15)%260),br=40+((hh>>5)%90);
      art+='<path d="M'+x+' '+y+'h'+len+'l'+br+' '+(hh%2?br:-br)+'h'+(70+(hh>>11)%120)+'" '
        +'fill="none" stroke="'+base+'" stroke-opacity=".30" stroke-width="1.5"/>'
        +'<circle cx="'+(x+len)+'" cy="'+y+'" r="3.2" fill="'+base+'" fill-opacity=".55"/>';
    }
  }else if(motif==='bars'){
    for(var b2=0;b2<22;b2++){
      var hb=hash((n.id||1)*17+b2),bh=40+(hb%300);
      art+='<rect x="'+(28+b2*35)+'" y="'+(420-bh)+'" width="16" height="'+bh+'" rx="2" '
        +'fill="'+base+'" fill-opacity="'+(0.10+(hb%5)*0.045).toFixed(3)+'"/>';
    }
    art+='<path d="M28 300 L 220 210 L 400 260 L 560 130 L 772 180" fill="none" '
      +'stroke="'+base+'" stroke-opacity=".62" stroke-width="2.4"/>';
  }else if(motif==='orbit'){
    for(var o=0;o<4;o++){
      art+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(70+o*78)+'" ry="'+(28+o*32)+'" '
        +'transform="rotate('+((h>>o)%70-35)+' '+cx+' '+cy+')" fill="none" stroke="'+base+'" '
        +'stroke-opacity="'+(0.42-o*0.08).toFixed(2)+'" stroke-width="1.4"/>';
    }
    art+='<circle cx="'+cx+'" cy="'+cy+'" r="30" fill="'+base+'" fill-opacity=".28"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="14" fill="'+base+'" fill-opacity=".55"/>';
  }else if(motif==='wave'){
    for(var w=0;w<7;w++){
      var amp=18+((h>>w)%46),off=60+w*52;
      art+='<path d="M-20 '+off+' Q 180 '+(off-amp)+' 400 '+off+' T 820 '+off+'" fill="none" '
        +'stroke="'+base+'" stroke-opacity="'+(0.5-w*0.05).toFixed(2)+'" stroke-width="1.6"/>';
    }
  }else{
    for(var g=0;g<30;g++){
      var hg=hash((n.id||1)*53+g),s=26+(hg%64);
      art+='<rect x="'+(hg%740)+'" y="'+((hg>>9)%390)+'" width="'+s+'" height="'+s+'" rx="4" '
        +'transform="rotate('+((hg>>5)%45)+' '+(hg%740)+' '+((hg>>9)%390)+')" '
        +'fill="none" stroke="'+base+'" stroke-opacity="'+(0.14+(hg%5)*0.05).toFixed(3)+'" stroke-width="1.3"/>';
    }
  }
  var grid='';
  for(var x2=0;x2<=800;x2+=50)grid+='<path d="M'+x2+' 0V450" stroke="'+ink+'" stroke-opacity=".04"/>';
  for(var y2=0;y2<=450;y2+=50)grid+='<path d="M0 '+y2+'H800" stroke="'+ink+'" stroke-opacity=".04"/>';

  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">'
    +'<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    +'<stop offset="0" stop-color="'+mid+'"/><stop offset="1" stop-color="'+dark+'"/></linearGradient>'
    +'<radialGradient id="r" cx="'+Math.round(cx/8)+'%" cy="'+Math.round(cy/4.5)+'%" r="72%">'
    +'<stop offset="0" stop-color="'+light+'" stop-opacity=".55"/>'
    +'<stop offset="1" stop-color="'+dark+'" stop-opacity="0"/></radialGradient></defs>'
    +'<rect width="800" height="450" fill="'+dark+'"/>'
    +'<rect width="800" height="450" fill="url(#g)"/>'+grid+art
    +'<rect width="800" height="450" fill="url(#r)"/></svg>';
  var uri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  COVERS.set(key,uri);
  return uri;
}
function imgFor(n){return n.image||coverFor(n);}

/* ============================================================
   FORMATOWANIE
   ============================================================ */
var MONTHS=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia',
  'września','października','listopada','grudnia'];
function fmtDate(d){var p=String(d||'').split('-');
  return p.length===3?(+p[2])+' '+MONTHS[(+p[1])-1]+' '+p[0]:String(d||'');}
function dayDiff(d){
  var p=String(d||'').split('-');if(p.length!==3)return null;
  var then=new Date(+p[0],+p[1]-1,+p[2]),now=new Date();
  return Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-then)/86400000);
}
function relDays(d){
  var diff=dayDiff(d);if(diff==null)return '';
  if(diff<=0)return 'dziś';if(diff===1)return 'wczoraj';
  if(diff<7)return diff+' dni temu';
  if(diff<30)return Math.floor(diff/7)+' tyg. temu';
  return fmtDate(d);
}
function dayLabel(d){
  var diff=dayDiff(d);
  if(diff===0)return '<b>Dziś</b> · '+fmtDate(d);
  if(diff===1)return '<b>Wczoraj</b> · '+fmtDate(d);
  return fmtDate(d);
}
function readMins(n){
  if(n._min)return n._min;
  var w=String(n.full||n.excerpt||'').trim().split(/\s+/).length;
  n._min=Math.max(1,Math.ceil(w/170));
  return n._min;
}
function isUrl(s){return /^https?:\/\//i.test(String(s||''));}

/* ============================================================
   DANE — API, a gdy niedostępne, plik ziarna
   ============================================================ */
function prepare(list){
  /* indeks wyszukiwania liczony raz, a nie przy każdym wpisanym znaku */
  list.forEach(function(n){
    n._hay=norm([n.title,n.excerpt,n.why,n.full,n.source,cat(n.category).label,
      (n.tags||[]).join(' ')].join(' '));
    n._min=0;
  });
  list.sort(function(a,b){
    var dd=String(b.date||'').localeCompare(String(a.date||''));
    if(dd)return dd;
    var ha=a.hot?1:0,hb=b.hot?1:0;
    if(ha!==hb)return hb-ha;
    return (b.id||0)-(a.id||0);
  });
  return list;
}
function loadData(){
  fetch('/api/news',{headers:{Accept:'application/json'}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){if(!d||!Array.isArray(d.news)||!d.news.length)throw new Error('pusto');return d;})
    .catch(function(){return fetch('/seed-news.json').then(function(r){return r.json();});})
    .then(function(d){
      NEWS=prepare(Array.isArray(d.news)?d.news:[]);META=d.meta||{};
      buildRail();render();syncTools();syncHeadH();openFromHash();
    })
    .catch(function(e){
      $('feed').innerHTML='<div class="empty"><h3>Nie udało się wczytać depesz</h3><p>'
        +esc(e.message||'?')+'</p></div>';
      $('metaLine').innerHTML='<span>błąd połączenia</span>';
    });
}

/* ============================================================
   FILTROWANIE — kanał + gorące + zapisane + fraza
   ============================================================ */
function filtered(){
  var words=search?norm(search).split(/\s+/).filter(Boolean):null;
  return NEWS.filter(function(n){
    if(activeCat!=='all'&&n.category!==activeCat)return false;
    if(hotOnly&&!n.hot)return false;
    if(savedOnly&&!isSaved(n.id))return false;
    if(words)for(var i=0;i<words.length;i++)if(n._hay.indexOf(words[i])<0)return false;
    return true;
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function buildRail(){
  var counts={};
  NEWS.forEach(function(n){counts[n.category]=(counts[n.category]||0)+1;});
  var h='<button data-cat="all" class="'+(activeCat==='all'?'on':'')+'" '
    +'aria-label="Wszystkie depesze">'+ico('luc-layers','icon-sm')
    +'<span class="lb">Wszystkie</span><span class="ct">'+NEWS.length+'</span>'
    +'</button><span class="sep"></span>';
  ORDER.forEach(function(id){
    if(!counts[id])return;
    var c=cat(id);
    h+='<button data-cat="'+id+'" class="'+(activeCat===id?'on':'')+'" style="--c:'+c.color+'" '
      +'aria-label="'+esc(c.label)+'">'+ico(c.icon,'icon-sm')
      +'<span class="lb">'+esc(c.label)+'</span><span class="ct">'+counts[id]+'</span></button>';
  });
  $('rail').innerHTML=h;
  var t='<button data-cat="all" class="'+(activeCat==='all'?'on':'')+'" aria-label="Wszystkie depesze">'
    +ico('luc-layers')+'<span>Wszystkie</span></button>';
  ORDER.filter(function(id){return counts[id];}).slice(0,4).forEach(function(id){
    var c=cat(id);
    t+='<button data-cat="'+id+'" class="'+(activeCat===id?'on':'')+'" style="--c:'+c.color+'" '
      +'aria-label="'+esc(c.label)+'">'+ico(c.icon)+'<span>'+esc(c.label)+'</span></button>';
  });
  t+='<button data-cat="__more" aria-label="Więcej kanałów">'+ico('luc-list')+'<span>Więcej</span></button>';
  $('tabbarIn').innerHTML=t;

  var g='<button data-cat="all" class="'+(activeCat==='all'?'on':'')+'">'
    +ico('luc-layers')+'<span>Wszystkie</span></button>';
  ORDER.forEach(function(id){
    if(!counts[id])return;
    var c=cat(id);
    g+='<button data-cat="'+id+'" class="'+(activeCat===id?'on':'')+'" style="--c:'+c.color+'">'
      +ico(c.icon)+'<span>'+esc(c.label)+'</span></button>';
  });
  $('sheetGrid').innerHTML=g;
}

/* w wierszu nagłówka wszystko musi być <span> — <div>/<button> w środku <button>
   to nieprawidłowe zagnieżdżenie, które parser wyrzuca poza przycisk */
function tagsHTML(n,inHead){
  if(!n.tags||!n.tags.length)return '';
  var w=inHead?'span':'div',e=inHead?'span':'button';
  var extra=inHead?' role="button" tabindex="-1"':'';
  return '<'+w+' class="tags'+(inHead?' p-tags':'')+'">'+n.tags.slice(0,4).map(function(t){
    return '<'+e+' data-tag="'+esc(t)+'"'+extra+'>#'+esc(t)+'</'+e+'>';}).join('')+'</'+w+'>';
}

function thumbHTML(n){
  var c=cat(n.category);
  return '<span class="p-thumb" style="--c:'+c.color+'">'
    +(n.image
      ?'<img src="'+esc(n.image)+'" alt="" loading="lazy" decoding="async" '
        +'onerror="this.remove()">'
      :'<span class="gl">'+ico(c.icon)+'</span>')
    +'</span>';
}

function headHTML(n){
  var c=cat(n.category),on=isSaved(n.id);
  return '<button class="post-head" aria-expanded="false">'
    +'<span class="p-ico">'+ico(c.icon)+'</span>'
    +'<span class="p-body">'
      +'<span class="p-title">'+esc(n.title)+'</span>'
      +(n.excerpt?'<span class="p-dek">'+esc(n.excerpt)+'</span>':'')
      +'<span class="p-meta">'
        +'<span class="ch">'+esc(c.label)+'</span><span class="sep"></span>'
        +'<span>'+esc(relDays(n.date))+'</span><span class="sep"></span>'
        +'<span>'+readMins(n)+' min</span>'
        +(n.source?'<span class="sep src"></span><span class="src">'+esc(n.source)+'</span>':'')
        +(n.hot?'<span class="sep"></span><span class="hot">HOT</span>':'')
      +'</span>'
      +tagsHTML(n,true)
    +'</span>'
    +thumbHTML(n)
    +'<span class="p-right">'
      +'<span class="act'+(on?' on':'')+'" data-save="'+n.id+'" role="button" tabindex="-1" '
        +'aria-pressed="'+(on?'true':'false')+'" title="Zapisz na później (S)">'+ico('luc-star','icon-sm')+'</span>'
      +'<span class="act" data-share="'+n.id+'" role="button" tabindex="-1" title="Kopiuj link">'
        +ico('luc-link','icon-sm')+'</span>'
      +'<span class="chev">'+ico('luc-chevron-down')+'</span>'
    +'</span>'
  +'</button>';
}

function bodyHTML(n){
  var c=cat(n.category),on=isSaved(n.id);
  var paras=String(n.full||n.excerpt||'').split(/\n{2,}/).filter(Boolean)
    .map(function(p){return '<p>'+esc(p.trim())+'</p>';}).join('');
  var src=n.source?(isUrl(n.source)
      ?'<a href="'+esc(n.source)+'" target="_blank" rel="noopener">'+ico('luc-external-link','icon-xs')+' Czytaj w źródle</a>'
      :'<span>Źródło: <b>'+esc(n.source)+'</b></span>'):'';
  var gist=n.why?'<div class="gist"><h4>'+ico('luc-zap','icon-xs')+' Sedno sprawy</h4>'
      +'<p>'+esc(n.why)+'</p></div>':'';
  var facts=(n.points&&n.points.length)
    ?'<div class="facts"><h4>'+ico('luc-layers','icon-xs')+' Konkrety</h4><ul>'
      +n.points.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul></div>'
    :'';
  var q=(n.questions&&n.questions.length)
    ?'<div class="sub"><h4>'+ico('luc-help','icon-xs')+' Do przemyślenia</h4>'
      +n.questions.map(function(x){return '<div class="q">'+esc(x)+'</div>';}).join('')+'</div>'
    :'';
  return '<div class="shot"><img src="'+esc(imgFor(n))+'" alt="" loading="lazy" decoding="async" '
      +'data-fb="'+esc(coverFor(n))+'" onerror="if(this.src!==this.dataset.fb)this.src=this.dataset.fb"></div>'
    +gist+facts
    +'<div class="article">'
      +(n.excerpt?'<p class="lead">'+esc(n.excerpt)+'</p>':'')
      +paras
      +tagsHTML(n,false)
      +'<div class="srcline">'+src
        +'<span>'+fmtDate(n.date)+'</span><span>·</span><span>'+readMins(n)+' min czytania</span></div>'
      +'<div class="rowtools">'
        +'<button class="'+(on?'on':'')+'" data-save="'+n.id+'" aria-pressed="'+(on?'true':'false')+'">'
          +ico('luc-star','icon-xs')+' <span class="lbl">'+(on?'Zapisane':'Zapisz')+'</span></button>'
        +'<button data-share="'+n.id+'">'+ico('luc-link','icon-xs')+' Link do depeszy</button>'
      +'</div>'
    +'</div>'
    +q
    +'<div class="sub"><h4>'+ico('luc-message','icon-xs')+' Komentarze <span class="cn"></span></h4>'
      +'<div class="clist"><div class="no-cmt">Ładowanie…</div></div>'
      +'<div class="cform">'
        +'<textarea placeholder="Napisz komentarz… (bez logowania)" maxlength="1200"></textarea>'
        +'<div class="r"><input type="text" placeholder="Twój nick (opcjonalnie)" maxlength="50">'
        +'<button class="send" data-send="'+n.id+'">'+ico('luc-send','icon-xs')+' Wyślij</button></div>'
        +'<div class="cmsg"></div>'
      +'</div>'
    +'</div>';
}

/* render partiami — pierwsza klatka rysuje 24 wiersze, reszta dochodzi
   przy dojeździe do końca listy (IntersectionObserver) */
function rowsHTML(list,from,to,lastDay){
  var html='';
  for(var i=from;i<to;i++){
    var n=list[i];
    if(n.date!==lastDay.v){lastDay.v=n.date;html+='<div class="day">'+dayLabel(n.date)+'</div>';}
    html+='<article class="post" data-news="'+n.id+'" id="news-'+n.id+'" tabindex="0" '
      +'style="--c:'+cat(n.category).color+'">'
      +headHTML(n)+'<div class="body"></div></article>';
  }
  return html;
}
var LASTDAY={v:''};
function appendChunk(){
  if(shown>=VIEW.length)return;
  var to=Math.min(shown+PAGE,VIEW.length);
  $('feed').insertAdjacentHTML('beforeend',rowsHTML(VIEW,shown,to,LASTDAY));
  shown=to;
  if(shown>=VIEW.length&&io)io.disconnect();
}
function render(){
  VIEW=filtered();shown=0;LASTDAY={v:''};READY.clear();
  var m=[];
  m.push('<span><b>'+VIEW.length+'</b> '+(VIEW.length===1?'depesza':'depesz')+'</span>');
  if(activeCat!=='all')m.push('<span>'+esc(cat(activeCat).label)+'</span>');
  if(hotOnly)m.push('<span>gorące</span>');
  if(savedOnly)m.push('<span>zapisane</span>');
  if(search)m.push('<span class="q-chip">„'+esc(search)+'”</span>');
  if(META.last_updated)m.push('<span>aktualizacja '+esc(fmtDate(META.last_updated))+'</span>');
  if(activeCat!=='all'||hotOnly||savedOnly||search)
    m.push('<button class="reset" id="resetBtn">wyczyść filtry</button>');
  $('metaLine').innerHTML=m.join('<span>·</span>');

  if(!VIEW.length){
    $('feed').innerHTML='<div class="empty"><h3>Brak depesz</h3>'
      +'<p>Nic nie pasuje do wybranych filtrów.</p>'
      +'<button id="resetBtn2">Pokaż wszystkie</button></div>';
    return;
  }
  $('feed').innerHTML='';
  appendChunk();
  if(io){io.disconnect();io.observe($('sentinel'));}
}

/* ============================================================
   ROZWIJANIE — treść budowana dopiero przy pierwszym otwarciu
   ============================================================ */
var BYID=null;
function newsById(id){
  if(!BYID){BYID=new Map();NEWS.forEach(function(n){BYID.set(Number(n.id),n);});}
  return BYID.get(Number(id))||null;
}
function toggle(el,force){
  var id=Number(el.dataset.news),open=force==null?!el.classList.contains('open'):force;
  if(open&&!READY.has(id)){
    var n=newsById(id);if(!n)return;
    el.querySelector('.body').innerHTML=bodyHTML(n);
    READY.add(id);
    loadComments(id);
  }
  el.classList.toggle('open',open);
  el.querySelector('.post-head').setAttribute('aria-expanded',open?'true':'false');
  if(open){try{history.replaceState(null,'','#news-'+id);}catch(e){}}
}
function headOffset(){return (document.querySelector('.top')||{offsetHeight:110}).offsetHeight+10;}
/* --head-h zasila sticky nagłówki dni — musi znać realną wysokość paska */
function syncHeadH(){
  var t=document.querySelector('.top');if(!t)return;
  document.documentElement.style.setProperty('--head-h',t.offsetHeight+'px');
}
function scrollToEl(el){
  window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-headOffset())});
}
function jumpTo(id){
  var n=newsById(id);if(!n)return;
  if(activeCat!=='all'&&n.category!==activeCat)activeCat='all';
  if(hotOnly&&!n.hot)hotOnly=false;
  if(savedOnly&&!isSaved(n.id))savedOnly=false;
  if(search){search='';$('q').value='';}
  buildRail();syncTools();render();
  /* depesza może być poza pierwszą partią — dosypujemy, aż będzie w DOM */
  var idx=VIEW.findIndex(function(x){return Number(x.id)===Number(id);});
  if(idx<0)return;
  while(shown<=idx)appendChunk();
  requestAnimationFrame(function(){
    var el=document.querySelector('[data-news="'+n.id+'"]');if(!el)return;
    toggle(el,true);scrollToEl(el);el.focus({preventScroll:true});
  });
}
function openFromHash(){
  var m=/^#news-(\d+)$/.exec(location.hash||'');
  if(m)jumpTo(+m[1]);
}

/* ============================================================
   KOMENTARZE
   ============================================================ */
function loadComments(id){
  fetch('/api/comments?news='+id)
    .then(function(r){return r.json();})
    .then(function(d){
      var list=d.comments||[];
      document.querySelectorAll('[data-news="'+id+'"]').forEach(function(card){
        var box=card.querySelector('.clist');if(!box)return;
        box.innerHTML=list.length?list.map(function(cm){
          var a=String(cm.author||'Anonim');
          return '<div class="cmt"><div class="cmt-h">'
            +'<span class="cmt-av">'+esc(a.slice(0,1).toUpperCase())+'</span>'
            +'<span class="cmt-a">'+esc(a)+'</span>'
            +'<span class="cmt-d">'+esc(cm.date||'')+(cm.time?' · '+esc(cm.time):'')+'</span></div>'
            +'<div class="cmt-b">'+esc(cm.content)+'</div></div>';
        }).join(''):'<div class="no-cmt">Brak komentarzy — bądź pierwszy.</div>';
        var cn=card.querySelector('.cn');if(cn)cn.textContent=list.length?'('+list.length+')':'';
      });
    })
    .catch(function(){
      document.querySelectorAll('[data-news="'+id+'"] .clist').forEach(function(el){
        el.innerHTML='<div class="no-cmt">Nie udało się wczytać komentarzy.</div>';});
    });
}
function sendComment(id,btn){
  var card=btn.closest('[data-news]');
  var ta=card.querySelector('.cform textarea'),au=card.querySelector('.cform input'),
      msg=card.querySelector('.cmsg');
  var content=(ta.value||'').trim();
  if(!content){msg.className='cmsg err';msg.textContent='Wpisz treść komentarza.';ta.focus();return;}
  btn.disabled=true;msg.className='cmsg pending';msg.textContent='Wysyłanie…';
  fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({newsId:Number(id),author:au.value||'Anonim',content:content})})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(res){
      if(!res.ok){msg.className='cmsg err';msg.textContent=res.d.error||'Błąd.';
        toast(res.d.error||'Błąd dodawania komentarza',true);return;}
      ta.value='';msg.className='cmsg ok';msg.textContent='✓ Komentarz dodany';
      toast('Komentarz dodany');loadComments(id);
      setTimeout(function(){msg.textContent='';},4000);
    })
    .catch(function(){msg.className='cmsg err';msg.textContent='Błąd sieci.';})
    .then(function(){btn.disabled=false;});
}

/* ============================================================
   DROBIAZGI — toast, udostępnianie, motyw
   ============================================================ */
var toastTimer=null;
function toast(msg,isErr){
  var t=$('toast');t.textContent=msg;t.className=(isErr?'err ':'')+'show';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='';},2400);
}
function shareNews(id){
  var n=newsById(id),url=location.origin+location.pathname+'#news-'+id;
  if(navigator.share){
    navigator.share({title:n?n.title:'AI Evolution News',url:url}).catch(function(){});
    return;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url)
      .then(function(){toast('Link skopiowany');})
      .catch(function(){toast(url);});
  }else toast(url);
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('aien-theme',t);}catch(e){}
  var meta=$('themeColorMeta');if(meta)meta.setAttribute('content',t==='dark'?'#080A0E':'#F5F7FA');
  $('themeBtn').innerHTML=ico(t==='dark'?'luc-moon':'luc-sun');
  document.querySelectorAll('.post.open .shot img').forEach(function(img){
    var post=img.closest('[data-news]');if(!post)return;
    var n=newsById(post.dataset.news);if(!n)return;
    var uri=coverFor(n);
    img.dataset.fb=uri;
    if(!n.image)img.src=uri;
  });
}
function syncTools(){
  $('hotBtn').classList.toggle('on',hotOnly);
  $('hotBtn').setAttribute('aria-pressed',hotOnly?'true':'false');
  $('savedBtn').classList.toggle('on',savedOnly);
  $('savedBtn').setAttribute('aria-pressed',savedOnly?'true':'false');
  var b=$('savedBadge');
  if(SAVED.size){b.hidden=false;b.textContent=SAVED.size;}else b.hidden=true;
}
function sheet(on){$('sheet').classList.toggle('show',on);}
function resetFilters(){
  activeCat='all';hotOnly=false;savedOnly=false;search='';$('q').value='';
  buildRail();syncTools();render();
}
function toggleSearch(force){
  var w=$('searchWrap'),on=force==null?!w.classList.contains('show'):force;
  w.classList.toggle('show',on);
  $('searchBtn').classList.toggle('on',on);
  syncHeadH();
  $('searchBtn').setAttribute('aria-pressed',on?'true':'false');
  if(on)setTimeout(function(){$('q').focus();},30);
  else if(search){search='';$('q').value='';render();}
}
function searchFor(phrase){
  toggleSearch(true);$('q').value=phrase;search=phrase;render();
  window.scrollTo({top:0});
}
function moveFocus(dir){
  var items=[].slice.call(document.querySelectorAll('.post'));
  if(!items.length)return;
  var cur=document.activeElement?document.activeElement.closest('.post'):null;
  var i=cur?items.indexOf(cur)+dir:0;
  if(i<0)i=0;if(i>=items.length){appendChunk();items=[].slice.call(document.querySelectorAll('.post'));
    i=Math.min(i,items.length-1);}
  items[i].focus({preventScroll:true});scrollToEl(items[i]);
}

/* ============================================================
   ZDARZENIA
   ============================================================ */
function setup(){
  setTheme(document.documentElement.getAttribute('data-theme')||'light');
  $('themeBtn').addEventListener('click',function(){
    setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');});

  if('IntersectionObserver' in window){
    io=new IntersectionObserver(function(es){
      if(es[0].isIntersecting)appendChunk();
    },{rootMargin:'800px 0px'});
  }else{PAGE=1e9;}

  function pickCat(c){
    if(c==='__more'){sheet(true);return;}
    sheet(false);
    activeCat=c;buildRail();render();
    window.scrollTo({top:0});
  }
  $('rail').addEventListener('click',function(e){
    var b=e.target.closest('[data-cat]');if(b)pickCat(b.dataset.cat);
  });
  $('tabbar').addEventListener('click',function(e){
    var b=e.target.closest('[data-cat]');if(b)pickCat(b.dataset.cat);
  });
  $('sheet').addEventListener('click',function(e){
    if(e.target.closest('[data-close]')){sheet(false);return;}
    var b=e.target.closest('[data-cat]');if(b)pickCat(b.dataset.cat);
  });

  $('hotBtn').addEventListener('click',function(){hotOnly=!hotOnly;syncTools();render();});
  $('savedBtn').addEventListener('click',function(){savedOnly=!savedOnly;syncTools();render();});
  $('searchBtn').addEventListener('click',function(){toggleSearch();});
  $('qClear').addEventListener('click',function(){toggleSearch(false);});

  $('q').addEventListener('input',function(){
    clearTimeout(searchTimer);
    var v=this.value;
    searchTimer=setTimeout(function(){search=v.trim();render();},180);
  });

  /* delegacja: cały strumień + treść rozwinięta */
  $('feed').addEventListener('click',function(e){
    var send=e.target.closest('[data-send]');
    if(send){sendComment(send.dataset.send,send);return;}
    var tag=e.target.closest('[data-tag]');
    if(tag){e.stopPropagation();searchFor(tag.dataset.tag);return;}
    var save=e.target.closest('[data-save]');
    if(save){e.stopPropagation();toggleSaved(save.dataset.save);return;}
    var share=e.target.closest('[data-share]');
    if(share){e.stopPropagation();shareNews(share.dataset.share);return;}
    if(e.target.closest('.body'))return;              /* klik w treści nie zwija */
    var post=e.target.closest('.post');if(!post)return;
    toggle(post);
  });

  document.addEventListener('click',function(e){
    if(e.target.id==='resetBtn'||e.target.id==='resetBtn2')resetFilters();
  });

  document.addEventListener('keydown',function(e){
    var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)
      ||document.activeElement.isContentEditable;
    if(e.key==='Escape'){
      if(document.activeElement===$('q')){toggleSearch(false);$('q').blur();return;}
      if($('sheet').classList.contains('show')){sheet(false);return;}
    }
    if(typing)return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==='/'){e.preventDefault();toggleSearch(true);return;}
    if(e.key==='j'||e.key==='J'){e.preventDefault();moveFocus(1);return;}
    if(e.key==='k'||e.key==='K'){e.preventDefault();moveFocus(-1);return;}
    var post=document.activeElement?document.activeElement.closest('.post'):null;
    if(!post)return;
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(post);return;}
    if(e.key==='s'||e.key==='S'){e.preventDefault();toggleSaved(post.dataset.news);return;}
  });

  window.addEventListener('hashchange',openFromHash);
  syncHeadH();
  window.addEventListener('resize',syncHeadH,{passive:true});

  var prog=$('progress'),top=$('toTop'),ticking=false;
  function paint(){
    ticking=false;
    var h=document.documentElement.scrollHeight-window.innerHeight;
    prog.style.width=(h>0?(window.scrollY/h*100):0)+'%';
    top.classList.toggle('show',window.scrollY>800);
  }
  window.addEventListener('scroll',function(){
    if(!ticking){ticking=true;requestAnimationFrame(paint);}
  },{passive:true});
  paint();
  top.addEventListener('click',function(){window.scrollTo({top:0});});
}

document.addEventListener('DOMContentLoaded',function(){loadSaved();setup();syncTools();loadData();});
</script>
